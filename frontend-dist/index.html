html+='<tr data-id="'+escHtml(f.id)+'"'+(ch?' class="is-picked"':'')+'><td class="cb-cell"><label class="cbx"><input type="checkbox" '+(ch?'checked':'')+' data-fid="'+escHtml(f.id)+'"><span class="cbx-box"></span></label></td><td><div class="file-name" data-action="preview" data-fid="'+escHtml(f.id)+'"><div class="file-icon" style="background:'+icon.bg+'">'+icon.emoji+'</div><span class="file-name-text">'+fname+'</span></div><div class="file-meta-m">'+fsize+' · '+badge+'</div></td><td class="file-size">'+fsize+'</td><td class="file-date col-date">'+date+'</td><td class="file-owner col-owner">'+escHtml(f.ownerName||'—')+'</td><td class="file-channel col-channel">'+badge+'</td><td>'+actionButtons(f.id,true)+'</td></tr>'}

function renderGrid(area){let html='<div class="file-grid">'+folderCardsHTML();for(const f of state.files){const icon=getFileIcon(f);const ch=state.selected.has(f.id);html+='<div class="file-grid-item'+(ch?' is-picked':'')+'" data-fid="'+escHtml(f.id)+'"><label class="cbx grid-cbx"><input type="checkbox" '+(ch?'checked':'')+' data-fid="'+escHtml(f.id)+'"><span class="cbx-box"></span></label><div class="file-icon" style="background:'+icon.bg+'">'+icon.emoji+'</div><div class="file-name-text">'+escHtml(fileNameOf(f))+'</div>'+actionButtons(f.id,false)+'</div>'}html+='</div>';area.innerHTML=html;area.querySelectorAll('.file-grid-item').forEach(item=>{item.addEventListener('click',e=>{if(e.target.closest('.file-action')||e.target.closest('.cbx'))return;const fid=item.dataset.fid;if(state.selectMode){toggleSelect(fid);return}const f=state.files.find(x=>x.id===fid);if(f)previewFile(f)});item.addEventListener('contextmenu',e=>showContextMenu(e,item.dataset.fid))});area.querySelectorAll('input[type=checkbox][data-fid]').forEach(cb=>{cb.addEventListener('change',()=>toggleSelect(cb.dataset.fid))});area.querySelectorAll('[data-action]').forEach(btn=>{btn.addEventListener('click',e=>{e.stopPropagation();handleFileAction(btn.dataset.action,btn.dataset.fid)})})}

function handleFileAction(action,fid){const f=state.files.find(x=>x.id===fid);if(!f)return;if(action==='download')downloadFile(f);else if(action==='preview')previewFile(f);else if(action==='transfer')showTransferModal([f.id]);else if(action==='delete')showDeleteConfirm([f]);else if(action==='rename')showRenameModal(f);else if(action==='share')showShareModal(f);else if(action==='records')showShareRecords(f);else if(action==='move')showMoveModal([f.id])}

function downloadFile(f){const a=document.createElement('a');a.href=f.src||('/file/'+f.id.split('/').map(encodeURIComponent).join('/'));a.download=fileNameOf(f).split('/').pop();a.target='_blank';a.click()}

function toggleSelect(fid){if(state.selected.has(fid))state.selected.delete(fid);else state.selected.add(fid);updateBatchBar();const on=state.selected.has(fid);const cb=document.querySelector('#fileArea input[type=checkbox][data-fid="'+CSS.escape(fid)+'"]');if(cb)cb.checked=on;const tr=document.querySelector('#fileArea tr[data-id="'+CSS.escape(fid)+'"]');if(tr)tr.classList.toggle('is-picked',on);const gi=document.querySelector('#fileArea .file-grid-item[data-fid="'+CSS.escape(fid)+'"]');if(gi)gi.classList.toggle('is-picked',on)}

function updateBatchBar(){const bar=document.getElementById('batchBar');const cnt=document.getElementById('batchCount');const mc=document.getElementById('multiCount');const n=state.selected.size;if(mc)mc.textContent=n;if(!bar)return;if(n>0){bar.style.display='flex';cnt.textContent='已选择 '+n+' 个文件'}else{bar.style.display='none'}}
function clearSelection(){state.selected.clear();updateBatchBar();renderFiles()}

function applySelectMode(){const area=document.getElementById('fileArea');if(area)area.classList.toggle('select-mode',state.selectMode);const btn=document.getElementById('multiSelectBtn');if(btn){btn.classList.toggle('active',state.selectMode);btn.title=state.selectMode?'退出多选':'开启多选'}}

/* ============ 分享链接（提取码 / 有效期 / 记录） ============ */
const SHARE_EXPIRES=[{v:'',label:'永久有效'},{v:'1',label:'1 小时'},{v:'24',label:'24 小时'},{v:'72',label:'3 天'},{v:'168',label:'7 天'},{v:'720',label:'30 天'}];

function showShareModal(f){
  const fid=f.id;
  const options=SHARE_EXPIRES.map(o=>'<option value="'+o.v+'">'+o.label+'</option>').join('');
  const overlay=showModal('<div class="modal-title">分享文件</div><div class="modal-body">'
    +'<div style="font-size:12px;color:var(--text3);margin-bottom:18px;word-break:break-all;line-height:1.5">'+escHtml(fileNameOf(f))+'</div>'
    +'<label class="switch"><input type="checkbox" id="shHasCode"><span class="switch-track"></span>需要提取码</label>'
    +'<div class="reveal" id="shCodeReveal" style="margin-top:12px"><div><input class="input" id="shCode" placeholder="留空自动生成 4 位数字" maxlength="16" autocomplete="off"></div></div>'
    +'<div style="margin-top:20px"><div style="font-size:12px;color:var(--text3);margin-bottom:6px">有效期</div>'
    +'<select id="shExpires">'+options+'</select></div>'
    +'<div id="shResult"></div>'
    +'</div><div class="modal-actions"><button class="btn btn-ghost modal-cancel">关闭</button><button class="btn btn-accent" id="shCreate">创建链接</button></div>');

  document.querySelector('.modal-cancel').addEventListener('click',e=>e.target.closest('.modal-overlay').remove());

  const cb=document.getElementById('shHasCode');
  cb.addEventListener('change',()=>{
    const r=document.getElementById('shCodeReveal');
    r.classList.toggle('open',cb.checked);
    if(cb.checked)setTimeout(()=>{const i=document.getElementById('shCode');if(i)i.focus()},200);
  });

  const expValue=()=>document.getElementById('shExpires').value;
  enhanceSelects(overlay);

  document.getElementById('shCreate').addEventListener('click',async()=>{
    const btn=document.getElementById('shCreate');
    const hasCode=cb.checked;
    const code=document.getElementById('shCode').value.trim();
    if(hasCode&&code&&!/^[A-Za-z0-9]+$/.test(code)){showToast('提取码只能用字母或数字','error');return}
    btn.disabled=true;btn.textContent='创建中...';
    const r=await fetch('/api/file/shares',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fileId:fid,hasCode,code,expiresHours:expValue()?Number(expValue()):null})});
    const d=await r.json();
    btn.disabled=false;btn.textContent='再创建一个';
    if(d.code!==0){showToast(d.message||'创建失败','error');return}
    const x=d.data;
    document.getElementById('shResult').innerHTML='<div class="share-result">'
      +'<div style="font-size:12px;color:var(--text3);margin-bottom:8px">分享链接'+(x.expiresAt?'（有效期至 '+new Date(x.expiresAt).toLocaleString('zh-CN')+'）':'（永久有效）')+'</div>'
      +'<div style="font-size:13px;word-break:break-all;color:var(--text2);line-height:1.6">'+escHtml(x.urlWithCode)+'</div>'
      +(x.code?'<div style="font-size:12.5px;margin-top:10px;color:var(--text3)">提取码 <b style="letter-spacing:4px;color:var(--text);font-size:15px">'+escHtml(x.code)+'</b></div>':'')
      +'<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'
      +'<button class="btn btn-accent btn-sm" id="cpLink">'+(x.code?'复制带码链接':'复制链接')+'</button>'
      +(x.code?'<button class="btn btn-ghost btn-sm" id="cpRaw">复制原始链接</button><button class="btn btn-ghost btn-sm" id="cpCode">复制提取码</button>':'')
      +'</div></div>';
    const copy=t=>navigator.clipboard.writeText(t).then(()=>showToast('已复制到剪贴板','success')).catch(()=>showToast('复制失败，请手动选择','error'));
    document.getElementById('cpLink').addEventListener('click',()=>copy(x.urlWithCode));
    if(x.code){document.getElementById('cpRaw').addEventListener('click',()=>copy(x.url));document.getElementById('cpCode').addEventListener('click',()=>copy(x.code))}
    showToast('分享链接已创建','success');loadActivityLogs();
  });
}
async function showShareRecords(f){
  const r=await fetch('/api/file/shares?fileId='+encodeURIComponent(f.id));
  const d=await r.json();
  const shares=(d.code===0&&d.data&&d.data.shares)||[];
  const rows=shares.length===0
    ?'<div style="padding:26px;text-align:center;color:var(--text3);font-size:13px">还没有创建过分享</div>'
    :shares.map(s=>'<div class="share-record'+(s.expired?' expired':'')+'"><div style="flex:1;min-width:0">'
      +'<div style="font-size:12.5px;word-break:break-all;color:var(--text2)">'+escHtml(s.url||'（好友直发，无链接）')+'</div>'
      +'<div class="share-record-meta">'+(s.code?'提取码 '+escHtml(s.code)+' · ':'无需提取码 · ')
      +(s.expiresAt?(s.expired?'已过期 ':'至 '+new Date(s.expiresAt).toLocaleString('zh-CN')+' '):'永久有效 · ')
      +'下载 <b>'+s.downloads+'</b> 次 · 浏览 <b>'+s.views+'</b> 次</div></div>'
      +'<div style="display:flex;gap:6px;flex-shrink:0">'+(s.url?'<button class="btn btn-ghost btn-sm" data-copy="'+escHtml(s.url)+'">复制</button>':'')
      +'<button class="btn btn-danger btn-sm" data-tok="'+escHtml(s.token||'')+'" data-id="'+escHtml(s.id)+'">'+(s.expired?'删除':'取消')+'</button>'
      +'</div></div>').join('');
  showModal('<div class="modal-title">分享记录</div><div class="modal-body"><div style="font-size:12px;color:var(--text3);margin-bottom:12px">'+escHtml(fileNameOf(f))+'</div><div style="max-height:52vh;overflow-y:auto">'+rows+'</div></div><div class="modal-actions"><button class="btn btn-ghost modal-cancel">关闭</button></div>');
  document.querySelector('.modal-cancel').addEventListener('click',e=>e.target.closest('.modal-overlay').remove());
  document.querySelectorAll('.share-record [data-copy]').forEach(b=>b.addEventListener('click',()=>navigator.clipboard.writeText(b.dataset.copy).then(()=>showToast('已复制','success')).catch(()=>showToast('复制失败','error'))));
  document.querySelectorAll('.share-record [data-tok]').forEach(b=>b.addEventListener('click',async()=>{
    const qs=b.dataset.tok?'token='+encodeURIComponent(b.dataset.tok):'id='+encodeURIComponent(b.dataset.id);
    await fetch('/api/file/shares?'+qs,{method:'DELETE'});
    showToast('分享已取消','success');closeAllModals();showShareRecords(f);
  }));
}

/* ============ 上传 ============ */
function setupDragDrop(){let dc=0;document.addEventListener('dragenter',e=>{e.preventDefault();dc++;const o=document.getElementById('dropOverlay');if(o)o.style.display='flex'});document.addEventListener('dragleave',e=>{e.preventDefault();dc--;if(dc<=0){dc=0;const o=document.getElementById('dropOverlay');if(o)o.style.display='none'}});document.addEventListener('dragover',e=>{e.preventDefault()});document.addEventListener('drop',e=>{e.preventDefault();dc=0;const o=document.getElementById('dropOverlay');if(o)o.style.display='none';if(e.dataTransfer.files.length>0)uploadFiles(e.dataTransfer.files)})}
function setupPaste(){document.addEventListener('paste',e=>{const items=e.clipboardData&&e.clipboardData.items;if(!items)return;const files=[];for(const item of items){if(item.kind==='file'){const f=item.getAsFile();if(f)files.push(f)}}if(files.length>0)uploadFiles(files)})}
function triggerUpload(){const inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.onchange=()=>{if(inp.files.length>0)uploadFiles(inp.files)};inp.click()}

async function uploadFiles(fileList){const panel=document.getElementById('uploadPanel');if(!panel)return;const files=Array.from(fileList);
  // ---- 同名检测：网盘已存在 + 正在上传中 + 本次选择里重复 ----
  const conflicts=[];const overwriteByName=new Map();
  const seenInBatch={};
  for(const file of files){
    const key=uploadBaseName(file.name).toLowerCase();
    if(seenInBatch[key]){conflicts.push({name:file.name,reason:'uploading',inBatch:true});}
    seenInBatch[key]=true;
    if(isUploading(file.name)){conflicts.push({name:file.name,reason:'uploading'});continue}
    const ex=await findExistingByName(file.name);
    if(ex.length){
      conflicts.push({name:file.name,reason:'exists'});
      overwriteByName.set(key,ex.map(x=>x.id));
    }
  }
  if(conflicts.length){const ok=await askOverwriteModal(conflicts);if(!ok)return}
  for(const file of files){
    const id='up_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
    const item=document.createElement('div');item.className='upload-item';item.id=id;
    item.innerHTML='<div class="upload-item-header"><span class="upload-item-name">'+escHtml(file.name)+'</span><span class="upload-item-pct">0%</span><button class="upload-cancel-btn" title="取消上传" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:0 4px;line-height:1">&times;</button></div><div class="upload-bar"><div class="upload-bar-fill" style="width:0%"></div></div><div class="upload-item-stats" style="font-size:11px;color:var(--text3);margin-top:4px;display:flex;justify-content:space-between"><span class="upload-stat-size">'+formatSize(0)+' / '+formatSize(file.size)+'</span><span class="upload-stat-speed"></span></div><div class="folder-sub">→ '+(state.nav==='all'&&state.currentDir?'/'+escHtml(state.currentDir):'根目录')+' · 通道 '+escHtml(currentChannelLabel())+'</div>';
    panel.appendChild(item);
    // ---- 上传大小限制（0=不限制）----
    const maxBytes=(state.maxUploadMB||0)*1024*1024;
    if(maxBytes>0&&file.size>maxBytes){
      const p=item.querySelector('.upload-item-pct');if(p)p.textContent='拒绝';
      const b=item.querySelector('.upload-bar-fill');if(b){b.style.background='var(--red)';b.style.width='100%'}
      const s=item.querySelector('.folder-sub');if(s)s.textContent='文件大小 '+formatSize(file.size)+' 超过上传限制 '+formatSize(maxBytes);
      const sz=item.querySelector('.upload-item-stats');if(sz)sz.style.color='var(--red)';
      showToast(file.name+' 超过上传限制（最大 '+formatSize(maxBytes)+'）','error');
      continue;
    }
    markUploading(file.name);
    const ac=new AbortController();
    const cancelBtn=item.querySelector('.upload-cancel-btn');
    if(cancelBtn)cancelBtn.addEventListener('click',()=>{ac.abort();unmarkUploading(file.name)},{once:true});
    try{await uploadSingleFile(file,id,{overwriteIds:overwriteByName.get(uploadBaseName(file.name).toLowerCase())||[],signal:ac.signal})}
    catch(e){
      if(item){
        const cancelled=ac.signal.aborted;
        const p=item.querySelector('.upload-item-pct');if(p)p.textContent=cancelled?'已取消':'失败';
        const b=item.querySelector('.upload-bar-fill');if(b){b.style.background=cancelled?'var(--text3)':'var(--red)';if(cancelled)b.style.width='0%'}
        const s=item.querySelector('.folder-sub');if(s)s.textContent=cancelled?'用户取消上传':'失败：'+e.message;
        const sz=item.querySelector('.upload-item-stats');if(sz)sz.style.color=cancelled?'var(--text3)':'var(--red)';
        if(!cancelled)showToast(file.name+' 上传失败：'+e.message,'error');
      }
    }
    finally{unmarkUploading(file.name)}
  }
  loadFiles();loadQuota();loadFolders();loadActivityLogs()}

async function uploadSingleFile(file,itemId,opt){
  opt=opt||{};
  const item=document.getElementById(itemId);
  const totalSize=file.size;
  const sig=opt.signal||null;
  const setPct=p=>{if(!item)return;const t=item.querySelector('.upload-item-pct');if(t)t.textContent=p+'%';const b=item.querySelector('.upload-bar-fill');if(b)b.style.width=p+'%'};
  let _upStart=Date.now(),_upLast=Date.now(),_upLoaded=0;
  const setStats=loaded=>{
    if(!item)return;
    const now=Date.now();const el=(now-_upLast)/1000;_upLast=now;
    const speed=el>0?(loaded-_upLoaded)/el:0;_upLoaded=loaded;
    const sEl=item.querySelector('.upload-stat-size');
    const spEl=item.querySelector('.upload-stat-speed');
    if(sEl)sEl.textContent=formatSize(loaded)+' / '+formatSize(totalSize);
    if(spEl){
      if(speed>1024*1024)spEl.textContent=(speed/1024/1024).toFixed(1)+' MB/s';
      else if(speed>1024)spEl.textContent=(speed/1024).toFixed(0)+' KB/s';
      else spEl.textContent=Math.round(speed)+' B/s';
    }
  };
  let ch=uploadChannelKey(), chName=uploadChannelName();
  if(ch==='auto'){const pick=autoPickChannel(file.size);if(!pick)throw new Error('没有可用的上传通道，请先在管理后台「存储通道」里配置');ch=pick.key||pick.channel;chName=pick.channelInstance||pick.name||''}
  const upDir=state.nav==='all'?state.currentDir:'';
  const base='/upload/?uploadChannel='+ch+(chName?'&channelName='+encodeURIComponent(chName):'')+(upDir?'&uploadFolder='+encodeURIComponent(upDir):'');
  const CHUNK=8*1024*1024, THRESH=24*1024*1024;
  let src='';
  const chType=channelTypeOf(ch);
  if(file.size>THRESH&&chType&&chType.chunkedUnsupported)throw new Error(chType.label+' 通道不支持分片上传，单次请求上限约 100MB');
  if(file.size>THRESH){
    const total=Math.ceil(file.size/CHUNK);
    const initFd=new FormData();
    initFd.append('originalFileName',file.name);
    initFd.append('originalFileType',file.type||'application/octet-stream');
    initFd.append('totalChunks',String(total));
    const initRes=await xhrUpload(base+'&initChunked=true',initFd,null,sig);
    let initJson={};try{initJson=JSON.parse(initRes.text)}catch(e){}
    const uploadId=initJson.uploadId||(initJson.sessionInfo&&initJson.sessionInfo.uploadId);
    if(!uploadId)throw new Error(errTextOf(initRes.text,'分片初始化失败'));
    let done=0;
    for(let i=0;i<total;i++){
      const start=i*CHUNK, end=Math.min(start+CHUNK,file.size);
      const fd=new FormData();
      fd.append('file',file.slice(start,end),file.name);
      fd.append('chunkIndex',String(i));
      fd.append('totalChunks',String(total));
      fd.append('uploadId',uploadId);
      fd.append('originalFileName',file.name);
      fd.append('originalFileType',file.type||'application/octet-stream');
      const r=await xhrUpload(base+'&chunked=true',fd,(loaded)=>{const cur=done+loaded;setPct(Math.min(99,Math.round(cur/totalSize*100)));setStats(cur)},sig);
      if(r.status<200||r.status>=300)throw new Error(errTextOf(r.text,'分片 '+(i+1)+'/'+total+' 上传失败'));
      done=end;
      setPct(Math.min(99,Math.round(done/totalSize*100)));setStats(done);
    }
    setPct(99);
    const mf=new FormData();
    mf.append('uploadId',uploadId);
    mf.append('totalChunks',String(total));
    mf.append('originalFileName',file.name);
    mf.append('originalFileType',file.type||'application/octet-stream');
    const mr=await xhrUpload(base+'&chunked=true&merge=true',mf,null,sig);
    if(mr.status<200||mr.status>=300)throw new Error(errTextOf(mr.text,'合并分片失败'));
    const parsed=parseUploadResult(mr.text);
    if(!parsed)throw new Error(errTextOf(mr.text,'合并分片失败'));
    src=parsed.src;
  }else{
    const fd=new FormData();fd.append('file',file);
    const r=await xhrUpload(base,fd,(loaded)=>{setPct(Math.min(99,Math.round(loaded/totalSize*100)));setStats(loaded)},sig);
    if(r.status<200||r.status>=300)throw new Error(errTextOf(r.text,'上传失败'));
    const parsed=parseUploadResult(r.text);
    if(!parsed)throw new Error(errTextOf(r.text,'上传失败'));
    src=parsed.src;
  }
  if(item){
    const t=item.querySelector('.upload-item-pct');if(t)t.textContent='完成';
    const b=item.querySelector('.upload-bar-fill');if(b)b.style.width='100%';
    const sp=item.querySelector('.upload-stat-speed');if(sp)sp.textContent='完成';
    const sz=item.querySelector('.upload-item-stats');if(sz)sz.style.color='var(--green)';
  }
  showToast(file.name+' 上传成功','success');
  try{await replaceExistingOnUpload(file.name,idFromSrc(src),opt.overwriteIds)}catch(e){}
  setTimeout(()=>{if(item&&item.parentNode)item.remove()},2000);
}

/* ============ 在线预览（文本 / 图片 / 视频 / 音频） ============ */
const PV_TEXT_EXT=/\.(txt|md|markdown|json|geojson|js|mjs|cjs|ts|tsx|jsx|css|scss|less|html|htm|xml|yml|yaml|toml|ini|conf|cfg|log|csv|tsv|sh|bash|zsh|bat|py|java|c|cpp|h|hpp|cs|go|rs|rb|php|sql|swift|kt|lua|pl|r|env|gitignore|srt|vtt)$/i;
const PV_TEXT_MIME=/^(text\/|application\/(json|xml|x-yaml|javascript|sql|x-sh))/i;
function previewKind(f){
  const name=fileNameOf(f).toLowerCase();
  const mime=String(f.fileType||f.type||'').toLowerCase();
  if(mime.indexOf('image/')===0||/\.(jpg|jpeg|png|gif|bmp|webp|svg|ico|avif)$/.test(name))return'image';
  if(mime.indexOf('video/')===0||/\.(mp4|webm|ogv|mov|m4v|mkv)$/.test(name))return'video';
  if(mime.indexOf('audio/')===0||/\.(mp3|wav|ogg|m4a|flac|aac|opus)$/.test(name))return'audio';
  if(PV_TEXT_MIME.test(mime)||PV_TEXT_EXT.test(name))return'text';
  return'';
}
function fileUrl(f){return f.src||('/file/'+String(f.id).split('/').map(encodeURIComponent).join('/'))}
function previewFile(f){
  if(!f||!f.id)return;
  const kind=previewKind(f);
  if(!kind)return; // 不支持预览的类型：点文件名没有任何反应（下载请用下载按钮）
  const url=fileUrl(f);
  const title=escHtml(fileNameOf(f));
  const foot='<div class="modal-actions"><button class="btn btn-ghost pv-close">关闭</button><button class="btn btn-accent pv-dl">下载</button></div>';
  let ov;
  if(kind==='image'){
    ov=showModal('<div class="modal-title">'+title+'</div><div class="modal-body"><div class="pv-body"><img class="pv-media" src="'+escHtml(url)+'" alt=""></div></div>'+foot);
  }else if(kind==='video'){
    ov=showModal('<div class="modal-title">'+title+'</div><div class="modal-body"><div class="pv-body"><video class="pv-media" src="'+escHtml(url)+'" controls autoplay playsinline></video></div></div>'+foot);
  }else if(kind==='audio'){
    ov=showModal('<div class="modal-title">'+title+'</div><div class="modal-body"><div class="pv-body"><audio class="pv-audio" src="'+escHtml(url)+'" controls autoplay></audio></div></div>'+foot);
  }else{
    ov=showModal('<div class="modal-title">'+title+'</div><div class="modal-body"><div class="pv-body"><pre class="pv-text" id="pvTextBox">加载中…</pre></div></div>'+foot);
    const MAX=512*1024;
    fetch(url).then(r=>r.text()).then(t=>{
      const box=ov.querySelector('#pvTextBox');if(!box)return;
      if(t.length>MAX)box.textContent=t.slice(0,MAX)+'\n\n…（文件过大，仅预览前 512KB，完整内容请下载）';
      else box.textContent=t;
    }).catch(()=>{const box=ov.querySelector('#pvTextBox');if(box)box.textContent='读取失败'});
  }
  const cb=ov.querySelector('.pv-close');if(cb)cb.addEventListener('click',()=>ov.remove());
  const db=ov.querySelector('.pv-dl');if(db)db.addEventListener('click',()=>downloadFile(f));
}

/* ============ 同名文件检测（已存在 + 正在上传中） ============ */
const uploadNameMap={};
function uploadBaseName(name){return String(name||'').split('/').pop()}
function uploadKey(name){return (state.nav==='all'?state.currentDir:'')+'::'+uploadBaseName(name).toLowerCase()}
function markUploading(name){state.uploading=state.uploading||new Map();const k=uploadKey(name);state.uploading.set(k,(state.uploading.get(k)||0)+1)}
function unmarkUploading(name){state.uploading=state.uploading||new Map();const k=uploadKey(name);const v=(state.uploading.get(k)||0)-1;if(v>0)state.uploading.set(k,v);else state.uploading.delete(k)}
function isUploading(name){return !!(state.uploading&&state.uploading.get(uploadKey(name)))}
function hasActiveUploads(){return !!(state.uploading&&state.uploading.size>0)}
window.addEventListener('beforeunload',e=>{if(hasActiveUploads()){e.preventDefault();e.returnValue=''}});
async function findExistingByName(name){
  const base=uploadBaseName(name).toLowerCase();
  const dir=state.nav==='all'?state.currentDir:'';
  const hits=[];
  for(const f of (state.files||[])){
    if(uploadBaseName(fileNameOf(f)).toLowerCase()===base&&!hits.some(x=>x.id===f.id))hits.push(f);
  }
  try{
    const p=new URLSearchParams({count:'200',dir:dir,search:uploadBaseName(name)});
    const r=await fetch('/api/manage/list?'+p);const d=await r.json();
    const files=(d.code===0&&d.data&&d.data.files)||[];
    for(const f of files){
      if(uploadBaseName(fileNameOf(f)).toLowerCase()!==base)continue;
      if(!hits.some(x=>x.id===f.id))hits.push(f);
    }
  }catch(e){}
  return hits;
}
function askOverwriteModal(list){

    const rows=list.map(c=>'<li>'+escHtml(c.name)+' <span style="color:'+(c.reason==='uploading'?'var(--orange)':'var(--text3)')+'">· '+(c.reason==='uploading'?(c.inBatch?'本次选择里重复':'正在上传中，还没传完'):'网盘里已存在同名文件')+'</span></li>').join('');
    const ov=showModal('<div class="modal-title">发现同名文件</div><div class="modal-body">'
      +'<div style="font-size:13px;line-height:1.7">下面这些文件与你要上传的文件重名：</div>'

/** 上传成功后删掉被覆盖的旧文件 */
async function replaceExistingOnUpload(name,newId,overwriteIds){
  const key=uploadKey(name);
  const ids=(overwriteIds||[]).slice();
  const prev=uploadNameMap[key];
  if(prev&&prev!==newId)ids.push(prev);
  if(newId)uploadNameMap[key]=newId;
  const uniq=Array.from(new Set(ids)).filter(x=>x&&x!==newId);
  if(!uniq.length)return;
  try{
    await fetch('/api/manage/delete/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fileIds:uniq})});
    showToast('已覆盖同名旧文件（'+uniq.length+' 个）','success');
  }catch(e){}
}

/* ============ 上传请求封装 ============ */
function xhrUpload(url,formData,onProgress,signal){
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    xhr.open('POST',url);
    if(onProgress&&xhr.upload)xhr.upload.onprogress=e=>{if(e.lengthComputable)onProgress(e.loaded,e.total)};
    xhr.onload=()=>resolve({status:xhr.status,text:xhr.responseText});
    xhr.onerror=()=>{if(signal&&signal.aborted)reject(new Error('已取消'));else reject(new Error('网络错误'))};
    xhr.ontimeout=()=>reject(new Error('请求超时'));
    if(signal){
      if(signal.aborted){reject(new Error('已取消'));return}
      signal.addEventListener('abort',()=>{xhr.abort()}, {once:true});
    }
    xhr.send(formData);
  });
}
function parseUploadResult(text){
  try{const j=JSON.parse(text);const item=Array.isArray(j)?j[0]:j;if(item&&item.src)return item}catch(e){}
  return null;
}
function idFromSrc(src){const t=String(src||'');const p=t.indexOf('/file/');return p>=0?decodeURIComponent(t.slice(p+6)):''}
function errTextOf(text,fallback){
  const t=String(text||'').replace(/^Error:\s*/,'').replace(/\s+/g,' ').trim();
  return t&&t.length<220?t:fallback;
}

function uploadChannelName(){const p=String(state.uploadChannel||'').split('|');return p.length>1?(p[1]||''):''}

    el.innerHTML='<option value="auto">'+(id==='uploadChannelSelect'?'自动通道':'自动')+'</option>'+opts;
    let cur=state.uploadChannel;if(![].some.call(el.options,o=>o.value===cur))cur='auto';
    el.value=cur;state.uploadChannel=cur});
}
/* 自动通道：优先挑「有限额且装得下」的（通常是 R2），其次挑不限额的（通常是 TG）。
   不写死任何渠道名 —— 顺序完全由你在后台配置的通道顺序决定。 */
function autoPickChannel(fileSize){
  const list=(state.channels||[]).filter(c=>c.connectable!==false);
  if(!list.length)return null;
  let firstUnlimited=null,firstAny=null;
  for(const c of list){const q=c.quota||{};const total=q.total||0;const unlimited=!!c.unlimited||total===0;
    if(!firstAny)firstAny=c;
    if(unlimited){if(!firstUnlimited)firstUnlimited=c;continue}
    if((q.used||0)+fileSize<=total)return c}
  return firstUnlimited||firstAny;
}
/* 当前上传通道的展示文案（写进上传条目里） */
function currentChannelLabel(){
  if(state.uploadChannel!=='auto'){const t=channelTypeOf(uploadChannelKey());const n=uploadChannelName();
    return (t?t.label:uploadChannelKey())+(n?' · '+n:'')}
  const p=autoPickChannel(0);return p?('自动 · '+(p.displayName||channelLabelOf(p.key))):'自动';
}

const FOLDER_SVG='<svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
const CHEV_S='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>';
const TRASH_S='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';

function escAttr(s){return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function parentOf(p){const t=String(p||'').replace(/\/$/,'');const i=t.lastIndexOf('/');return i===-1?'':t.slice(0,i+1)}
function baseName(p){return String(p||'').replace(/\/$/,'').split('/').pop()||''}

function childFoldersOf(parent){return(state.folders||[]).filter(f=>f.parent===parent).sort((a,b)=>String(a.name).localeCompare(String(b.name),'zh-CN',{numeric:true}))}

function folderTreeHTML(parent){const kids=childFoldersOf(parent);if(!kids.length)return'';

// 展开 / 收起某个节点：只切类、不重渲染，保证 grid 行高过渡动画不被打断
function setNodeOpen(path,open){const row=findTreeRow(path);if(!row)return;
    row.classList.toggle('expanded',open);
    const kids=row.nextElementSibling;
    if(kids&&kids.classList.contains('tree-kids')){
        if(open){const inner=kids.firstElementChild;
            if(inner&&!inner.innerHTML.trim())inner.innerHTML=folderTreeHTML(path)}
        kids.classList.toggle('open',open)}}

// 让左侧树与当前路径同步：路径上的层级展开、刚退出来的那几层收起、当前项滚进可视区
function syncTreeToPath(path){
    const segs=String(path||'').split('/').filter(Boolean);
    const chain=new Set();let acc='';
    segs.forEach(s=>{acc+=s+'/';chain.add(acc)});
    // 1) 收起「比当前路径更深」的展开项（就是刚退出来的那些层），其他文件夹的展开状态保留
    Array.from(state.openFolders).forEach(p=>{
        const deeper=segs.length===0?true:(p!==path&&p.startsWith(path));
        if(deeper){state.openFolders.delete(p);setNodeOpen(p,false)}});
    // 2) 逐级展开路径上的每一层（顺带懒加载下级）
    acc='';
    segs.forEach(s=>{acc+=s+'/';state.openFolders.add(acc);setNodeOpen(acc,true)});
    toggleAllFiles(true);
    syncTreeActive();
    scrollActiveRowIntoView()}

function scrollActiveRowIntoView(){const el=document.querySelector('.sidebar-nav .sidebar-nav-item.active');

    if(r.top<n.top+2||r.bottom>n.bottom-2)nav.scrollTop+=r.top-n.top-8}

async function deleteFolder(path){
    let stats={count:0,size:0};
    try{ stats=await getFolderStats(path); }catch(e){}
    const overlay=showModal('<div class="modal-title">删除文件夹</div><div class="modal-body">'
        +'确定删除「'+escHtml(baseName(path))+'」吗？'
        +'<div class="folder-hint">该文件夹包含 '+stats.count+' 个文件，共 '+formatSize(stats.size)+'，删除后不可恢复。</div>'
        +'</div><div class="modal-actions"><button class="btn btn-ghost df-cancel">取消</button><button class="btn btn-danger" id="dfOk">删除</button></div>');
    document.querySelector('.df-cancel').addEventListener('click',e=>e.target.closest('.modal-overlay').remove());
    document.getElementById('dfOk').addEventListener('click',async()=>{
        const r=await fetch('/api/folders?path='+encodeURIComponent(path),{method:'DELETE'});
        const d=await r.json();
        if(d.code!==0){showToast(d.message||'删除失败','error');return}
        showToast('文件夹已删除','success');closeAllModals();
        state.openFolders.delete(path);
        if(state.currentDir===path||state.currentDir.startsWith(path))state.currentDir=parentOf(path);
        await loadFolders();loadFiles();loadActivityLogs();syncTreeToPath(state.currentDir)});
}

async function getFolderStats(path){
    let count=0,size=0;
    const queue=[path];
    while(queue.length){
        const dir=queue.shift();
        const r=await fetch('/api/manage/list?count=-1&dir='+encodeURIComponent(dir));
        const d=await r.json();
        const files=(d.data&&d.data.files)||[];
        count+=files.length;
        for(const f of files){ size+=(f.fileSize||0); }
        const dirs=(d.data&&d.data.directories)||[];
        for(const sub of dirs) queue.push(sub);
    }
    return {count,size};
}

async function loadUserProfile(){const r=await fetch('/api/user/profile');const d=await r.json();if(d.code===0&&d.data){currentUserProfile=d.data;updateUserAvatar()}}
function updateUserAvatar(){const el=document.getElementById('userAvatar');if(!el)return;el.innerHTML=avatarHTML(currentUserProfile,18)}

async function loadTags(){const r=await fetch('/api/userConfig');const d=await r.json();if(d.code===0&&d.data&&d.data.tags){const sec=document.getElementById('tagsSection');const c=document.getElementById('tagsContainer');if(sec&&c&&d.data.tags.length>0){sec.style.display='';c.innerHTML=d.data.tags.map(t=>'<span class="badge" style="background:var(--surface);color:var(--text2);margin:2px 4px 2px 0;cursor:pointer;border:1px solid var(--border);font-size:11px;padding:3px 8px">'+escHtml(t)+'</span>').join('')}}}

document.addEventListener('click',()=>closeAllDropdowns());
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAllDropdowns()});
document.addEventListener('DOMContentLoaded',()=>{applyTheme(state.theme);checkSession();document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAllModals()});document.addEventListener('click',e=>{if(!e.target.closest('.context-menu'))hideContextMenu()})});
</script>
</body>
</html>
