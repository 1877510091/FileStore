<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FileStore网盘</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23A78BFA' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z'/%3E%3C/svg%3E">
<style>
:root{--bg0:#15131f;--bg1:#1d1830;--bg2:#241d3a;--surface:rgba(42,36,64,.72);--surface-hi:rgba(54,46,82,.92);--surface-lo:rgba(34,29,52,.55);--sidebar:rgba(38,32,58,.72);--border:#3a2f55;--text:#ECE9FB;--text2:#B8A6F0;--text3:#8A82B8;--accent:#F472B6;--accent-h:#F9A8D4;--accent-p:#DB2777;--grad:linear-gradient(90deg,#A78BFA,#F472B6);--green:#34C759;--orange:#FF9500;--red:#EE5A6F;--purple:#8B5CF6;--radius:12px;--card-bg:rgba(46,40,68,.82);--input-bg:rgba(54,47,80,.65);--btn-bg:rgba(58,50,86,.72);--panel-bg:rgba(40,34,60,.50)}
[data-theme="light"]{--bg0:#FFF0F5;--bg1:#FFE4E1;--bg2:#E6E6FA;--surface:rgba(255,255,255,.70);--surface-hi:rgba(255,255,255,.90);--surface-lo:rgba(255,255,255,.55);--sidebar:rgba(255,255,255,.62);--border:#F3DCE9;--text:#1E1B4B;--text2:#6366F1;--text3:#A5A8D8;--accent:#EC4899;--accent-h:#F472B6;--accent-p:#DB2777;--grad:linear-gradient(90deg,#8B5CF6,#EC4899);--card-bg:rgba(255,255,255,.78);--input-bg:rgba(255,255,255,.68);--btn-bg:rgba(255,255,255,.62);--panel-bg:rgba(255,255,255,.35)}
*{margin:0;padding:0;box-sizing:border-box}html,body,#app{height:100%;width:100%;overflow:hidden}
body{font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif;background:var(--bg0);color:var(--text);transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(167,139,250,.18) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(244,114,182,.15) 0%,transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(139,92,246,.08) 0%,transparent 70%);pointer-events:none;z-index:0}
[data-theme="light"] body::before{background:radial-gradient(ellipse at 20% 20%,rgba(139,92,246,.1) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(236,72,153,.08) 0%,transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(99,102,241,.05) 0%,transparent 70%)}
button{cursor:pointer;font-family:inherit}input{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--text3)}
.glass{background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius)}
.glass-hi{background:var(--surface-hi);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--radius)}
.btn{padding:8px 20px;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;transition:all .2s;color:#fff}
.btn-accent{background:var(--grad);color:#fff}.btn-accent:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 4px 15px rgba(244,114,182,.3)}
.btn-ghost{background:var(--btn-bg);color:var(--text);border:1px solid var(--border)}.btn-ghost:hover{background:var(--surface-hi)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{opacity:.9}
.input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--input-bg);color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.input:focus{border-color:var(--accent)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}.fade-in{animation:fadeIn .3s ease}
.login-page{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1000}
.login-card{width:380px;padding:40px;text-align:center;animation:fadeIn .5s ease}
.login-logo{width:80px;height:80px;margin:0 auto 20px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 32px rgba(167,139,250,.3)}
.login-title{font-size:24px;font-weight:700;margin-bottom:4px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-subtitle{font-size:13px;color:var(--text3);margin-bottom:28px}
.login-input{margin-bottom:16px}.login-btn{width:100%;padding:12px;font-size:15px}
.login-error{color:var(--red);font-size:13px;margin-top:8px;min-height:20px}.login-rate{color:var(--orange);font-size:12px;margin-top:4px}
.theme-toggle{position:fixed;top:16px;right:16px;z-index:1001;width:40px;height:40px;border-radius:50%;background:var(--btn-bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all .2s;backdrop-filter:blur(10px);color:var(--text2)}
.theme-toggle:hover{background:var(--surface-hi);transform:rotate(30deg);color:var(--text)}
.main-layout{display:flex;height:100%;position:relative;z-index:1}
.sidebar{width:240px;min-width:240px;height:100%;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--sidebar);backdrop-filter:blur(10px)}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border)}
.sidebar-logo{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sidebar-logo-mark{width:32px;height:32px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
.sidebar-logo-text{font-size:16px;font-weight:700}.sidebar-domain{font-size:11px;color:var(--text3);padding-left:42px}
.sidebar-upload{margin:16px}.sidebar-upload .btn{width:100%;padding:10px;font-size:14px}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px}
.sidebar-nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);color:var(--text2);font-size:13px;cursor:pointer;transition:all .2s;margin-bottom:2px}
.sidebar-nav-item:hover,.sidebar-nav-item.active{background:var(--surface);color:var(--text)}.sidebar-nav-item.active{font-weight:600}
.sidebar-nav-item svg{width:18px;height:18px;flex-shrink:0}
.sidebar-nav-item .unread-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
/* ===== 侧栏目录树（全部文件为根，默认收起）===== */
.tree-chev{width:14px;height:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:transform .3s cubic-bezier(.4,0,.2,1),color .2s ease}
.tree-chev svg{width:12px;height:12px}
.tree-chev.empty{visibility:hidden}
.sidebar-nav-item.expanded>.tree-chev{transform:rotate(90deg);color:var(--text2)}
.sidebar-nav-item .tree-icon{width:18px;height:18px;flex-shrink:0}
.sidebar-nav-item .tree-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-count{margin-left:auto;font-size:10px;line-height:15px;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0 6px;flex-shrink:0}
/* 嵌套层：每多一级再叠一层缩进 + 引导线（文件夹的上下级关系靠这个体现） */
.tree-kids>.tree-kids-inner{border-left:1px solid var(--border);margin-left:17px}
.tree-kids .sidebar-nav-item{padding:7px 10px;font-size:12.5px}
.tree-kids .sidebar-nav-item svg{width:16px;height:16px}
.tree-kids .tree-chev svg{width:11px;height:11px}
/* 顶层容器同时装着「文件夹分支」和 4 个分类项，所以它自己不缩进 */
#allFilesTree>.tree-kids-inner{margin-left:0;border-left:0}
/* 文件夹分支：缩进 17px + 竖直引导线，和「全部文件」拉开层级 */
.tree-branch{margin-left:17px;border-left:1px solid var(--border)}
.tree-branch.is-empty{margin-left:0;border-left:0}
/* 最近上传 / 图片 / 视频 / 文档：与「全部文件」严格同一列（同一 padding、同一字号、同一图标尺寸） */
#allFilesTree>.tree-kids-inner>.sidebar-nav-item.tree-sub{padding:7px 8px 7px 12px;font-size:13px}
#allFilesTree>.tree-kids-inner>.sidebar-nav-item.tree-sub svg{width:18px;height:18px}
.sidebar-upload-channel{display:flex;align-items:center;gap:8px;margin-top:8px}
.sidebar-upload-channel>span{font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0}
.sidebar-upload-channel .dd{flex:1;min-width:0}
/* ===== 面包屑 ===== */
.crumb-bar{display:flex;align-items:center;gap:1px;padding:9px 20px 2px;flex-wrap:wrap;font-size:12px;color:var(--text3)}
.crumb{display:inline-flex;align-items:center;padding:3px 8px;border-radius:7px;cursor:pointer;transition:background .16s ease,color .16s ease}
.crumb:hover{background:var(--surface);color:var(--text)}
.crumb.last{color:var(--text);font-weight:600;cursor:default}
.crumb.last:hover{background:transparent}
.crumb-sep{color:var(--text3);opacity:.55;padding:0 1px}
.crumb-icon{display:flex;width:14px;height:14px;margin-right:5px;color:var(--text3)}
.crumb-icon svg{width:100%;height:100%}
/* ===== 文件列表里的文件夹 ===== */
.folder-row{cursor:pointer}
.folder-row td{background:rgba(167,139,250,.05)}
.folder-row:hover td{background:rgba(167,139,250,.11)}
.folder-row .file-name-text{font-weight:500}
.folder-grid{cursor:pointer}
.folder-sub{font-size:10px;color:var(--text3);margin-top:2px}
.folder-loc{font-size:12px;color:var(--text3);margin-bottom:10px;word-break:break-all;line-height:1.5}
.folder-hint{font-size:11.5px;color:var(--text3);margin-top:8px;line-height:1.55}
.folder-new-row{display:flex;gap:8px;margin-top:12px}
.folder-new-row .btn{white-space:nowrap}
.modal-body .dd{margin-top:2px}
.sidebar-section{padding:12px 12px 4px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.sidebar-footer{padding:8px;border-top:1px solid var(--border);background:var(--surface-lo)}
.sidebar-footer-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);color:var(--text2);font-size:13px;text-decoration:none;transition:all .2s;border:1px solid transparent;background:transparent;font-family:inherit;cursor:pointer}
.sidebar-footer-btn:hover{background:var(--surface);color:var(--text);border-color:var(--border)}
.sidebar-footer-btn svg{width:18px;height:18px;flex-shrink:0}
.apps-wrap{padding:2px 12px 6px}
.app-link{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:4px;border-radius:var(--radius);color:var(--text2);font-size:13px;text-decoration:none;transition:background .2s,color .2s,border-color .2s,transform .2s;background:var(--surface-lo);border:1px solid transparent}
.app-link:hover{background:var(--surface);color:var(--text);border-color:var(--border);transform:translateX(2px)}
.app-link .app-ico{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.app-link .app-ico svg{width:18px;height:18px}
.app-link .app-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-link .app-go{font-size:13px;opacity:.45}
.sidebar-channel{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius);font-size:12px;margin-bottom:2px}
.sidebar-channel .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0} .sidebar-channel .ch-ico{display:flex;align-items:center;justify-content:center;width:16px;flex-shrink:0}.sidebar-channel .dot.green{background:var(--green)}.sidebar-channel .dot.orange{background:var(--orange)}
.sidebar-channel .channel-bar{flex:1;height:4px;background:var(--surface);border-radius:2px;overflow:hidden}
.sidebar-channel .channel-fill{height:100%;border-radius:2px;transition:width .3s}
.sidebar-group{padding:8px 12px;margin:0 8px;border-radius:var(--radius);background:var(--surface-lo);margin-bottom:8px}
.sidebar-group-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.sidebar-group-members{display:flex;flex-wrap:wrap;gap:4px}
.sidebar-group-member{width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text3);cursor:pointer;position:relative;overflow:hidden}
.sidebar-group-member img{width:100%;height:100%;object-fit:cover}
.sidebar-group-member svg{width:16px;height:16px}
.activity-log{padding:8px 12px}
.activity-log-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--surface-lo);font-size:11px;color:var(--text3)}
.activity-log-item:last-child{border-bottom:none}
.activity-log-item .act-user{color:var(--accent);font-weight:600;white-space:nowrap}
.activity-log-item .act-file{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.activity-log-item .act-time{white-space:nowrap;font-size:10px;opacity:.7}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{position:relative;z-index:5;height:52px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--surface);backdrop-filter:blur(10px)}
.topbar-logo{display:flex;align-items:center;gap:8px}
.topbar-logo-mark{width:28px;height:28px;border-radius:6px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px}
.topbar-logo-text{font-size:14px;font-weight:700}
.topbar-domain{font-size:10px;color:var(--text3);background:var(--surface-lo);padding:2px 8px;border-radius:10px;border:1px solid var(--border)}
.topbar-storage{display:flex;align-items:center;gap:8px;min-width:220px}
.topbar-storage-bar{flex:1;height:8px;background:var(--surface-lo);border-radius:4px;overflow:hidden;display:flex}
.topbar-storage-seg{height:100%;transition:width .3s}
.topbar-storage-seg.others{background:#6B7280;border-radius:4px 0 0 4px}
.topbar-storage-seg.self{background:var(--grad)}
.topbar-storage-seg.available{background:var(--surface);flex:1}
.topbar-storage-text{font-size:11px;color:var(--text3);white-space:nowrap}
.storage-legend{display:flex;gap:10px;font-size:10px;color:var(--text3);padding:0 20px 8px;flex-wrap:wrap}
.storage-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.topbar-channel select{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--input-bg);color:var(--text);font-size:12px;outline:none}
.topbar-search{flex:1;max-width:300px;position:relative}
.topbar-search .input{padding-left:32px;padding-right:12px;height:34px}
.topbar-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);width:16px;height:16px}
.topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.topbar-btn{width:34px;height:34px;border-radius:var(--radius);background:var(--btn-bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .2s}
.topbar-btn:hover{background:var(--surface-hi);color:var(--text)}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;overflow:hidden}
.user-avatar:hover{border-color:var(--accent);transform:scale(1.05)}
.user-avatar img{width:100%;height:100%;object-fit:cover}
/* 头像图片统一铺满容器并居中裁切：不要依赖各个容器自己写 img 规则 */
.avatar-img{display:block;width:100%;height:100%;object-fit:cover}
.user-avatar svg{width:18px;height:18px}
.toolbar{position:relative;z-index:4;display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--border)}
.toolbar-left{display:flex;align-items:center;gap:8px}.toolbar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.sort-select{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--input-bg);color:var(--text);font-size:12px;outline:none}
.view-toggle{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.view-toggle button{width:32px;height:30px;border:none;background:var(--btn-bg);color:var(--text3);display:flex;align-items:center;justify-content:center;transition:all .2s}
.view-toggle button.active{background:var(--accent);color:#fff}
.batch-bar{display:flex;align-items:center;gap:8px;padding:8px 20px;background:var(--surface-hi);border-bottom:1px solid var(--border);animation:fadeIn .2s}
.batch-bar span{font-size:13px;color:var(--text2)}.batch-bar .btn{padding:6px 14px;font-size:12px}
.file-area{flex:1;overflow-y:auto;padding:0 20px 20px}
.file-table{width:100%;border-collapse:collapse}
.file-table th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg0);z-index:1}
.file-table td{padding:10px 12px;border-bottom:1px solid rgba(58,47,86,.3);font-size:13px}
.file-table tr:hover td{background:var(--surface-lo)}
/* ===== 多选：默认收起整列，开启后丝滑展开 ===== */
.file-table th.cb-cell,.file-table td.cb-cell{position:relative;width:0;padding:0;opacity:0;overflow:hidden;transition:width .32s cubic-bezier(.4,0,.2,1),padding .32s cubic-bezier(.4,0,.2,1),opacity .22s ease}
.file-area.select-mode .file-table th.cb-cell,.file-area.select-mode .file-table td.cb-cell{width:48px;padding:10px 14px;opacity:1}
.cbx{position:absolute;left:14px;top:50%;width:20px;height:20px;transform:translateY(-50%) scale(.4);opacity:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .18s ease}
.select-mode .cbx{transform:translateY(-50%) scale(1);opacity:1}
.cbx input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.cbx-box{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--border);background:var(--surface-lo);display:flex;align-items:center;justify-content:center;transition:background .2s ease,border-color .2s ease,box-shadow .2s ease,transform .2s ease}
.cbx:hover .cbx-box{border-color:var(--accent);transform:scale(1.12);box-shadow:0 0 0 4px rgba(244,114,182,.13)}
.cbx input:checked+.cbx-box{background:var(--grad);border-color:transparent;box-shadow:0 2px 10px rgba(244,114,182,.38)}
.cbx-box::after{content:'';width:5px;height:9px;margin-top:-2px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(45deg) scale(0);opacity:0;transition:transform .24s cubic-bezier(.34,1.56,.64,1) .03s,opacity .14s ease}
.cbx input:checked+.cbx-box::after{transform:rotate(45deg) scale(1);opacity:1}
.file-table tr.is-picked td{background:rgba(167,139,250,.09)}
.multi-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;height:30px;border-radius:var(--radius);border:1px solid var(--border);background:var(--btn-bg);color:var(--text2);font-size:12px;white-space:nowrap;transition:all .22s cubic-bezier(.4,0,.2,1)}
.multi-btn:hover{background:var(--surface-hi);color:var(--text);border-color:var(--accent)}
.multi-btn.active{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 3px 14px rgba(244,114,182,.32)}
.multi-btn .cnt{display:none;min-width:16px;line-height:16px;padding:0 5px;border-radius:9px;background:rgba(255,255,255,.28);font-size:10px;text-align:center}
.multi-btn.active .cnt{display:block}
.file-name{display:flex;align-items:center;gap:10px;cursor:pointer}
.file-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.file-name-text{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:400px} .file-meta-m{display:none} .pv-body{display:flex;align-items:center;justify-content:center;max-height:70vh;overflow:auto;background:var(--surface-lo);border-radius:12px;padding:8px} .pv-media{max-width:100%;max-height:66vh;border-radius:8px;display:block} .pv-audio{width:100%;max-width:440px} .pv-text{margin:0;width:100%;max-height:66vh;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:12.5px;line-height:1.65;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.file-size{color:var(--text3);white-space:nowrap}.file-date{color:var(--text3);white-space:nowrap;font-size:12px}
.file-channel{white-space:nowrap}
.file-owner{font-size:12px;color:var(--text3);white-space:nowrap}
.file-actions{white-space:nowrap;display:flex;gap:4px;opacity:0;transition:opacity .2s}
.file-table tr:hover .file-actions{opacity:1}
.file-action{width:30px;height:30px;border-radius:6px;border:none;background:transparent;color:var(--text3);display:flex;align-items:center;justify-content:center;transition:all .2s}
.file-action:hover{background:var(--surface);color:var(--text)}.file-action.del:hover{color:var(--red)}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding-top:12px}
.file-grid-item{position:relative;padding:16px;border-radius:var(--radius);background:var(--card-bg);border:1px solid var(--border);cursor:pointer;transition:all .2s;text-align:center}
.file-grid-item.is-picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 6px 22px rgba(244,114,182,.22)}
.grid-cbx{position:absolute;left:10px;top:10px;transform:translateY(0) scale(.4);opacity:0;z-index:2;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .18s ease}
.select-mode .grid-cbx{transform:translateY(0) scale(1);opacity:1}
.file-grid-item:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.2);border-color:var(--accent)}
.file-grid-item .file-icon{width:48px;height:48px;margin:0 auto 10px;font-size:24px}
.file-grid-item .file-name-text{font-size:12px;margin-bottom:4px}
.file-grid-item .file-actions{justify-content:center;margin-top:8px;opacity:0}
.file-grid-item:hover .file-actions{opacity:1}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text3)}
.empty-state svg{width:80px;height:80px;margin-bottom:16px;opacity:.3}.empty-state p{font-size:15px;margin-bottom:16px}
.drop-overlay{position:fixed;inset:0;background:rgba(21,19,31,.85);z-index:2000;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.drop-box{width:400px;height:280px;border:3px dashed var(--accent);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.drop-box svg{width:64px;height:64px;color:var(--accent);opacity:.7}.drop-box p{font-size:18px;font-weight:600;color:var(--text)}.drop-box span{font-size:13px;color:var(--text3)}
.upload-panel{position:fixed;bottom:20px;right:20px;width:340px;z-index:1500;display:flex;flex-direction:column;gap:8px}
.upload-item{padding:12px;border-radius:var(--radius);background:var(--surface-hi);backdrop-filter:blur(10px);border:1px solid var(--border);animation:fadeIn .3s}
.upload-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.upload-item-name{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.upload-item-pct{font-size:11px;color:var(--text3)}
.upload-bar{height:4px;background:var(--surface);border-radius:2px;overflow:hidden}
.upload-bar-fill{height:100%;background:var(--grad);border-radius:2px;transition:width .3s}
.modal-overlay{position:fixed;inset:0;background:rgba(21,19,31,.7);z-index:3000;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.modal{width:440px;max-width:90vw;max-height:88vh;overflow-y:auto;padding:24px;animation:fadeIn .3s}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px}
.modal-body{margin-bottom:20px;font-size:14px;color:var(--text2)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.context-menu{position:fixed;z-index:4000;min-width:160px;padding:6px;border-radius:var(--radius);background:var(--surface-hi);backdrop-filter:blur(12px);border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.context-menu-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;font-size:13px;color:var(--text2);cursor:pointer;transition:all .15s}
.context-menu-item:hover{background:var(--surface);color:var(--text)}.context-menu-item.danger{color:var(--red)}.context-menu-item.danger:hover{background:rgba(238,90,111,.1)}
.toast-container{position:fixed;top:16px;right:16px;z-index:5000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:var(--radius);background:var(--surface-hi);backdrop-filter:blur(10px);border:1px solid var(--border);font-size:13px;animation:fadeIn .3s;min-width:200px;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.toast.success{border-left:3px solid var(--green)}.toast.error{border-left:3px solid var(--red)}.toast.info{border-left:3px solid var(--accent)}
.loading{display:flex;align-items:center;justify-content:center;padding:40px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
.avatar-cropper-overlay{position:fixed;inset:0;background:rgba(21,19,31,.8);z-index:3500;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.avatar-cropper{width:380px;padding:24px;background:var(--surface-hi);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(12px)}
.avatar-cropper-title{font-size:17px;font-weight:700;margin-bottom:16px}
/* 裁剪舞台：尺寸由 JS 按图片原始比例设定 —— 整张图完整可见，不会被裁掉边缘 */
.cropper-stage{position:relative;margin:0 auto 12px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--surface-lo);touch-action:none}
.cropper-stage img{display:block;width:100%;height:100%;pointer-events:none;user-select:none;-webkit-user-drag:none}
/* 圆形裁剪框：拖它取景；框外压暗用的是它的超大 box-shadow，被 stage 的 overflow 裁掉 */
.cropper-frame{position:absolute;left:0;top:0;border-radius:50%;cursor:grab;box-shadow:0 0 0 9999px rgba(9,8,15,.62),inset 0 0 0 1.5px rgba(255,255,255,.85)}
.cropper-frame.dragging{cursor:grabbing}
.avatar-cropper-hint{font-size:11.5px;color:var(--text3);text-align:center;margin-bottom:10px}
.avatar-cropper-slider input[type=range]{width:100%}
.avatar-cropper-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.friends-page{flex:1;display:flex;flex-direction:column;overflow:hidden;animation:fadeIn .3s ease}
.friends-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.friends-header h2{font-size:18px;font-weight:700}
.friends-tabs{display:flex;gap:4px}
.friends-tab{padding:6px 14px;border-radius:var(--radius);font-size:13px;color:var(--text3);cursor:pointer;transition:all .2s;border:none;background:none}
.friends-tab.active{background:var(--surface);color:var(--text);font-weight:600}
.friends-tab:hover{color:var(--text)}
.friends-subtab.active{background:var(--surface);color:var(--text);font-weight:600}
.friends-content{flex:1;display:flex;overflow:hidden}
.friends-list-panel{width:300px;min-width:300px;border-right:1px solid var(--border);overflow-y:auto;padding:8px}
.friend-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);cursor:pointer;transition:all .2s}
.friend-item:hover,.friend-item.active{background:var(--surface)}
.friend-avatar{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--text3);flex-shrink:0;overflow:hidden}
.friend-avatar img{width:100%;height:100%;object-fit:cover}
.friend-avatar svg{width:20px;height:20px}
.friend-info{flex:1;min-width:0}
.friend-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.friend-status{font-size:11px;color:var(--text3)}
.friend-unread{margin-left:auto;background:var(--red);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.chat-panel{flex:1;display:flex;flex-direction:column}
.chat-header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.chat-header-name{font-size:15px;font-weight:600}
.chat-warning{background:rgba(255,149,0,.12);color:var(--orange);padding:6px 20px;font-size:12px;text-align:center;border-bottom:1px solid var(--border)}
.chat-messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.chat-msg{max-width:70%;display:flex;flex-direction:column;gap:4px}
.chat-msg.self{align-self:flex-end}
.chat-msg.other{align-self:flex-start}
.chat-msg-bubble{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5;word-break:break-word}
.chat-msg.self .chat-msg-bubble{background:var(--grad);color:#fff;border-bottom-right-radius:4px}
.chat-msg.other .chat-msg-bubble{background:var(--surface);color:var(--text);border-bottom-left-radius:4px}
.chat-msg-time{font-size:10px;color:var(--text3);padding:0 4px}
.chat-msg.self .chat-msg-time{text-align:right}
.chat-msg-file{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.1);cursor:pointer;transition:background .2s}
.chat-msg.other .chat-msg-file{background:var(--surface-lo)}
.chat-msg-file svg{width:20px;height:20px;color:var(--accent);flex-shrink:0}
.chat-msg-file-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-input-area{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end}
.chat-input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--input-bg);color:var(--text);font-size:13px;outline:none;resize:none;min-height:40px;max-height:120px;font-family:inherit}
.chat-input:focus{border-color:var(--accent)}
.chat-send-btn{padding:10px 16px;border-radius:var(--radius);background:var(--grad);color:#fff;border:none;font-weight:600;font-size:13px;cursor:pointer;transition:all .2s}
.chat-send-btn:hover{opacity:.9}
.chat-share-btn{padding:10px;border-radius:var(--radius);background:var(--btn-bg);color:var(--text2);border:1px solid var(--border);cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.chat-share-btn:hover{background:var(--surface-hi);color:var(--text)}
.search-users-panel{padding:12px;border-bottom:1px solid var(--border)}
.search-users-panel .input{font-size:12px;padding:8px 12px}
.friend-request-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius);margin-bottom:4px;background:var(--surface-lo)}
.share-modal-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:8px}
.share-modal-tab{padding:6px 14px;border-radius:var(--radius);font-size:13px;color:var(--text3);cursor:pointer;transition:all .2s;border:none;background:none}
.share-modal-tab.active{color:var(--text);font-weight:600}
.share-modal-tab:hover{color:var(--text)}
.share-link-url{display:flex;gap:8px}
.share-link-url .input{flex:1}
.share-friend-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:var(--radius);transition:all .2s;cursor:pointer;flex-wrap:wrap}
.share-friend-item:hover{background:var(--surface)}
.share-friend-item .friend-avatar{width:32px;height:32px}
.perm-checks{display:flex;flex-wrap:wrap;gap:10px;width:100%;padding:6px 0 2px 42px}
.share-perm-check{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);cursor:pointer}
.share-record{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;background:var(--surface-lo);margin-bottom:8px}
.share-record.expired{opacity:.55}
.share-record-meta{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.5}
.share-record-meta b{color:var(--text2)}
/* ===== 分享设置：开关 / 展开区 / 自定义下拉 ===== */
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-size:13px;color:var(--text2)}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch-track{width:40px;height:22px;border-radius:11px;background:var(--surface);border:1px solid var(--border);position:relative;flex-shrink:0;transition:background .22s ease,border-color .22s ease}
.switch-track::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text3);transition:transform .26s cubic-bezier(.34,1.56,.64,1),background .22s ease}
.switch:hover .switch-track{border-color:var(--accent)}
.switch input:checked+.switch-track{background:var(--grad);border-color:transparent}
.switch input:checked+.switch-track::after{transform:translateX(18px);background:#fff}
.reveal{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .34s cubic-bezier(.4,0,.2,1),opacity .24s ease}
.reveal.open{grid-template-rows:1fr;opacity:1}
.reveal>div{overflow:hidden;min-height:0}
.dd{position:relative}
.dd-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--input-bg);color:var(--text);font-size:14px;cursor:pointer;transition:border-color .2s ease,background .2s ease}
.dd-trigger:hover{border-color:var(--accent)}
.dd.open .dd-trigger{border-color:var(--accent)}
.dd-trigger svg{color:var(--text3);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.dd.open .dd-trigger svg{transform:rotate(180deg)}
.dd-panel{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1),opacity .22s ease}
.dd-panel>div{overflow:hidden;min-height:0}
.dd.open .dd-panel{grid-template-rows:1fr;opacity:1}
.dd-list{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-hi);padding:6px;margin-top:6px}
.dd-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;font-size:13px;color:var(--text2);cursor:pointer;transition:background .16s ease,color .16s ease}
.dd-item:hover{background:var(--surface);color:var(--text)}
.dd-item.sel{color:var(--accent);font-weight:600}
.dd-item.sel::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:8px;flex-shrink:0}
/* ===== 通用下拉：把原生 <select> 升级成跟随主题的组件 ===== */
.dd-select-native{position:absolute!important;left:0;top:0;width:1px!important;height:1px!important;opacity:0;pointer-events:none;margin:0;padding:0;border:0;overflow:hidden}
.dd-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-trigger{width:100%}
.dd-overlay .dd-panel{position:absolute;top:calc(100% + 5px);left:0;min-width:100%;width:max-content;max-width:min(340px,88vw);z-index:900}
.dd-overlay .dd-list{margin-top:0;box-shadow:0 16px 38px rgba(0,0,0,.32)}
.dd-sm .dd-trigger{padding:6px 10px;font-size:12px;gap:6px}
.dd-sm .dd-trigger svg{width:12px;height:12px}
.dd-sm .dd-item{padding:8px 10px;font-size:12px}
/* ===== 行内自定义勾选框（复用 .cbx-box 的方框与动画）===== */
.chk{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);cursor:pointer;user-select:none}
.chk input{position:absolute;opacity:0;width:0;height:0;margin:0}
.chk .cbx-box{width:16px;height:16px;border-radius:5px;flex-shrink:0}
.chk:hover .cbx-box{border-color:var(--accent);transform:scale(1.12);box-shadow:0 0 0 4px rgba(244,114,182,.13)}
.chk input:checked+.cbx-box{background:var(--grad);border-color:transparent;box-shadow:0 2px 10px rgba(244,114,182,.38)}
.chk input:checked+.cbx-box::after{transform:rotate(45deg) scale(1);opacity:1}
/* ===== 滑块 / 数字输入 跟随主题 ===== */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:18px;width:100%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--surface);border:1px solid var(--border)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;margin-top:-5.5px;border-radius:50%;background:var(--grad);border:none;box-shadow:0 2px 8px rgba(244,114,182,.45);cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--surface);border:1px solid var(--border)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:#A78BFA;box-shadow:0 2px 8px rgba(244,114,182,.45);cursor:pointer}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.65;transition:opacity .2s ease}
input[type=date]::-webkit-calendar-picker-indicator:hover{opacity:1}
[data-theme="dark"] input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.9)}
.share-result{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--panel-bg);margin-top:16px;animation:fadeIn .3s ease}
.grant-row{display:flex;align-items:center;gap:8px;padding:10px;border-radius:var(--radius);background:var(--surface-lo);margin-bottom:6px;flex-wrap:wrap}
.grant-perms{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.form-group{margin-bottom:14px;text-align:left}
.form-group label{display:block;font-size:12px;color:var(--text3);margin-bottom:4px}
.sidebar-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;transition:color .2s ease}
.sidebar-toggle:hover{color:var(--text2)}
.sidebar-toggle .toggle-hint{margin-left:auto;font-weight:400;text-transform:none;font-size:10px;letter-spacing:0;opacity:.75}
.sidebar-toggle .chev{width:12px;height:12px;flex-shrink:0;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.sidebar-toggle.open .chev{transform:rotate(180deg)}
.sidebar-mask{position:fixed;inset:0;background:rgba(9,7,16,.6);z-index:1100;opacity:0;pointer-events:none;transition:opacity .3s ease}
.sidebar-mask.show{opacity:1;pointer-events:auto}
.mobile-only{display:none}
@media(max-width:820px){
  .mobile-only{display:flex}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:1200;width:264px;min-width:264px;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:0 0 40px rgba(0,0,0,.4)}
  .sidebar.open{transform:none}
  .topbar{padding:0 12px;gap:8px}
  .topbar-domain,.topbar-storage,.topbar-channel,.storage-legend,#logoutBtn{display:none}
  .topbar-search{max-width:100%;flex:1}
  .topbar-logo-text{display:none}
  .toolbar{flex-wrap:wrap;gap:6px;padding:10px 12px}

  .toolbar-right{width:100%}
  .file-area{padding:0 12px 16px}
  .file-table th,.file-table td{padding:9px 8px}
  .col-owner,.col-channel,.col-date{display:none}   .file-meta-m{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;color:var(--text3)}
  .file-name-text{max-width:32vw}
  .file-actions{opacity:1!important}
  .file-action[data-action="rename"]{display:none}
  .file-action{width:24px;height:24px}   .file-action svg{width:13px;height:13px}   .file-action[data-action="records"]{display:none}   .file-actions{gap:2px}
  .file-grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
  .batch-bar{flex-wrap:wrap;padding:8px 12px}
  .modal{width:calc(100vw - 24px);max-height:86vh;padding:18px}
  .avatar-cropper{width:calc(100vw - 32px);padding:18px}
  .upload-panel{left:12px;right:12px;bottom:12px;width:auto}
  .friends-list-panel{width:100%;min-width:100%;max-height:38vh;flex-shrink:0;border-right:none;border-bottom:1px solid var(--border)}
  .friends-content{flex-direction:column}
  .chat-panel{flex:1;min-height:0}
  .chat-msg{max-width:86%}
  .friends-header{padding:12px;gap:8px}
  .friends-header h2{font-size:16px}
  .friends-tab{padding:5px 10px;font-size:12px}

  .stats-grid{grid-template-columns:1fr 1fr}
  .context-menu{min-width:150px}
}

.apps-zone{position:relative;padding:6px 8px 0}
.apps-toggle{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:4px;padding:7px 10px;border-radius:var(--radius);font-size:12px;color:var(--text2);background:var(--surface-lo);border:1px solid var(--border);cursor:pointer;font-family:inherit;transition:background .2s,color .2s,border-color .2s}
.apps-toggle:hover{background:var(--surface);color:var(--text);border-color:var(--accent)}

function escHtml(s){const d=document.createElement('div');d.textContent=(s===undefined||s===null)?'':s;return d.innerHTML}
/* ===== 自定义下拉：把原生 <select> 升级成跟随主题的组件（原生 select 仍持有值，所有既有逻辑不变）===== */
const DD_CHEV='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>';
function closeAllDropdowns(){document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open'))}
function enhanceSelect(sel,opt){
  if(!sel||sel.dataset.ddReady)return;
  opt=opt||{};
  const width=opt.width||sel.style.width||'auto';
  sel.dataset.ddReady='1';
  const dd=document.createElement('div');
  dd.className='dd'+(opt.overlay?' dd-overlay':'')+(opt.small?' dd-sm':'');
  if(width)dd.style.width=width;
  sel.parentNode.insertBefore(dd,sel);
  dd.appendChild(sel);
  sel.classList.add('dd-select-native');
  sel.setAttribute('tabindex','-1');
  const trigger=document.createElement('button');
  trigger.type='button';trigger.className='dd-trigger';
  trigger.setAttribute('aria-haspopup','listbox');
  trigger.innerHTML='<span class="dd-label"></span>'+DD_CHEV;
  const panel=document.createElement('div');panel.className='dd-panel';
  const list=document.createElement('div');list.className='dd-list';
  panel.appendChild(list);dd.appendChild(trigger);dd.appendChild(panel);
  const label=trigger.querySelector('.dd-label');
  const sync=()=>{
    const i=sel.selectedIndex,o=sel.options[i];
    label.textContent=o?o.textContent:'—';
    list.innerHTML=Array.from(sel.options).map((op,k)=>'<div class="dd-item'+(k===i?' sel':'')+'" data-i="'+k+'">'+escHtml(op.textContent)+'</div>').join('');
  };
  new MutationObserver(sync).observe(sel,{childList:true,subtree:true,attributes:true});
  trigger.addEventListener('click',ev=>{ev.stopPropagation();const was=dd.classList.contains('open');closeAllDropdowns();if(!was)dd.classList.add('open')});
  list.addEventListener('click',ev=>{const it=ev.target.closest('.dd-item');if(!it)return;const k=parseInt(it.dataset.i,10);if(k!==sel.selectedIndex){sel.selectedIndex=k;sel.dispatchEvent(new Event('change',{bubbles:true}))}sync();dd.classList.remove('open')});
  sync();
}
function enhanceSelects(root){
  (root||document).querySelectorAll('select').forEach(sel=>{
    if(sel.dataset.ddReady)return;
    const inModal=!!sel.closest('.modal');
    const full=sel.classList.contains('select');
    enhanceSelect(sel,{overlay:!inModal,small:!inModal&&!full,width:sel.style.width||(full?'100%':'auto')});
  });
}
function formatSize(b){if(!b||b===0)return'0 B';const u=['B','KB','MB','GB','TB'];const i=Math.floor(Math.log(b)/Math.log(1024));return(b/Math.pow(1024,i)).toFixed(i>0?1:0)+' '+u[i]}
function getFileType(f){const n=String((f&&(f.fileName||f.name||f.id))||'').toLowerCase();
  if(/\.(jpg|jpeg|png|gif|bmp|webp|svg|ico|tiff|tif|avif|heic|heif)$/.test(n))return{type:'image',color:'#EC4899',emoji:'\uD83D\uDDBC\uFE0F'};
  if(/\.(mp4|avi|mkv|mov|wmv|flv|webm|m4v|mpeg|mpg|3gp|ts)$/.test(n))return{type:'video',color:'#8B5CF6',emoji:'\uD83C\uDFAC'};
  if(/\.(mp3|wav|flac|aac|ogg|wma|m4a|opus|aiff|mid)$/.test(n))return{type:'audio',color:'#60A5FA',emoji:'\uD83C\uDFB5'};
  if(/\.(pdf|doc|docx|xls|xlsx|ppt|pptx|txt|csv|tsv|md|markdown|rtf|odt|ods|odp|pages|numbers|key|log)$/.test(n))return{type:'doc',color:'#34C759',emoji:'\uD83D\uDCC4'};
  if(/\.(zip|rar|7z|tar|gz|tgz|bz2|xz|zst)$/.test(n))return{type:'archive',color:'#FF9500',emoji:'\uD83D\uDCE6'};
  if(/\.(json|json5|xml|yml|yaml|toml|ini|conf|cfg|env|properties|js|mjs|cjs|ts|tsx|jsx|py|java|c|cc|cpp|cxx|h|hpp|cs|go|rs|rb|php|pl|lua|swift|kt|kts|scala|sql|sh|bash|zsh|bat|cmd|ps1|vue|svelte|dart)$/.test(n)||n==='dockerfile'||n==='makefile')return{type:'code',color:'#14B8A6',emoji:'\uD83D\uDCDC'};
  if(/\.(bin|iso|img|dmg|vhd|vhdx|raw|vmdk|qcow2|dat|db|sqlite|sqlite3|mdb|bak)$/.test(n))return{type:'disk',color:'#64748B',emoji:'\uD83D\uDCBE'};
  if(/\.(exe|msi|apk|ipa|deb|rpm|appimage|dll|so|dylib|jar|class)$/.test(n))return{type:'app',color:'#F59E0B',emoji:'\u2699\uFE0F'};
  if(/\.(psd|ai|sketch|fig|xd|eps|indd|afdesign|afphoto)$/.test(n))return{type:'design',color:'#A855F7',emoji:'\uD83C\uDFA8'};
  if(/\.(ttf|otf|woff|woff2|eot)$/.test(n))return{type:'font',color:'#0EA5E9',emoji:'\uD83D\uDD24'};
  if(/\.(epub|mobi|azw|azw3|fb2|djvu)$/.test(n))return{type:'ebook',color:'#22C55E',emoji:'\uD83D\uDCDA'};
  if(/\.(srt|vtt|ass|ssa|sub)$/.test(n))return{type:'subtitle',color:'#38BDF8',emoji:'\uD83D\uDCAC'};
  return{type:'other',color:'#8A82B8',emoji:'\uD83D\uDCC3'}}
function getFileIcon(f){const t=getFileType(f);return{bg:t.color+'22',emoji:t.emoji,color:t.color}}

function avatarInitial(u){const n=String((u&&(u.displayName||u.username||u.name))||'').trim();return n?n.slice(0,1).toUpperCase():''}
function avatarFallbackSpan(u,px,show){const ini=avatarInitial(u);const fs=Math.max(10,Math.round((px||36)*0.45));

function avatarImgError(img){try{img.style.display='none';const s=img.nextElementSibling;if(s&&s.classList.contains('avatar-fb'))s.style.display='flex'}catch(e){}}
function avatarHTML(u,size){

  if(u&&u.avatar)return'<img class="avatar-img" src="'+escHtml(u.avatar)+'" alt="" onerror="avatarImgError(this)">'+avatarFallbackSpan(u,px,false);
  return avatarFallbackSpan(u,px,true);
}

async function shareFileToChat(fileId,fileName){const sr=await fetch('/api/file/shares',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fileId,shareType:'friend',sharedWith:state.chatFriend.userId,permissions:['read']})});const sd=await sr.json();if(sd.code!==0){showToast(sd.message||'分享失败','error');return}const r=await fetch('/api/chat/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({receiverId:state.chatFriend.userId,message:fileName,fileShareId:sd.data.id,messageType:'file'})});const d=await r.json();if(d.code===0){showToast('已发送文件','success');closeAllModals();loadChatMessages()}else showToast(d.message||'发送失败','error')}

function startChatPoll(){stopChatPoll();chatPollTimerId=setInterval(()=>{if(state.currentView==='chat'&&state.chatFriend){loadChatMessages()}pollUnread()},3000)}
function stopChatPoll(){if(chatPollTimerId){clearInterval(chatPollTimerId);chatPollTimerId=null}}

async function pollUnread(){const r=await fetch('/api/chat/unread');const d=await r.json();if(d.code!==0)return;const count=(d.data&&d.data.total)||0;state.unread=count;const badge=document.getElementById('chatUnreadBadge');if(badge){badge.textContent=count;badge.style.display=count>0?'flex':'none'}const fb=document.getElementById('friendUnreadBadge');if(fb){fb.textContent=count;fb.style.display=count>0?'flex':'none'}}

/* ============ 组管理 ============ */
async function loadMyGroups(){const r=await fetch('/api/user/groups');const d=await r.json();const el=document.getElementById('myGroupsList');if(!el)return;if(d.code!==0||!d.data||!d.data.groups||d.data.groups.length===0){el.innerHTML='<div style="padding:20px;text-align:center;color:var(--text3);font-size:13px">暂未加入任何组</div>';return}state.myGroups=d.data.groups;renderMyGroupsList(d.data.groups)}
function renderMyGroupsList(groups){const el=document.getElementById('myGroupsList');if(!el)return;el.innerHTML=groups.map(g=>{const roleLabel=g.myRole==='owner'?'群主':g.myRole==='admin'?'管理员':'';return'<div class="friend-item" onclick="showGroupDetail(\''+escHtml(g.id)+'\')"><div class="friend-avatar">'+(g.avatar?'<img src="'+escHtml(g.avatar)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;color:var(--text3)"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>')+'</div><div class="friend-info"><div class="friend-name">'+escHtml(g.name)+'</div><div class="friend-status">组号: '+escHtml(g.groupCode||'无')+' · '+roleLabel+' · '+g.members.length+'人</div></div></div>'}).join('')}

function showCreateGroupModal(){showModal('<div class="modal-title">新建组</div><div class="modal-body"><div class="form-group"><label>组头像</label><div style="display:flex;align-items:center;gap:12px"><div id="createGroupAvatarPreview" style="width:64px;height:64px;border-radius:50%;background:var(--surface);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden" title="点击上传"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:28px;height:28px;color:var(--text3)"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><input type="file" id="createGroupAvatarInput" accept="image/*" style="display:none"></div><div style="font-size:11px;color:var(--text3)">可选，点击上传</div></div></div><div class="form-group"><label>组名称 *</label><input class="input" id="createGroupName" placeholder="输入组名"></div><div class="form-group"><label>组号（6位纯数字）</label><div style="display:flex;gap:8px"><input class="input" id="createGroupCode" placeholder="自动生成" maxlength="6"><button class="btn btn-ghost" onclick="document.getElementById(\'createGroupCode\').value=String(Math.floor(100000+Math.random()*900000))" style="white-space:nowrap">刷新</button></div></div><div class="form-group"><label>默认上传权限</label><div style="display:flex;gap:12px"><label class="chk"><input type="radio" name="createGroupUpload" value="on" checked><span></span>所有人可上传</label><label class="chk"><input type="radio" name="createGroupUpload" value="off"><span></span>仅管理员可上传</label></div></div><div class="form-group"><label>邀请好友（可选）</label><div id="createGroupInviteList" style="max-height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:8px"></div></div></div><div class="modal-actions"><button class="btn btn-ghost modal-cancel">取消</button><button class="btn btn-accent modal-confirm">创建</button></div>');document.querySelector('.modal-cancel').addEventListener('click',e=>e.target.closest('.modal-overlay').remove());document.getElementById('createGroupAvatarInput').addEventListener('change',e=>{const file=e.target.files[0];if(file){const reader=new FileReader();reader.onload=ev=>{document.getElementById('createGroupAvatarPreview').innerHTML='<img src="'+ev.target.result+'" style="width:100%;height:100%;object-fit:cover">'};reader.readAsDataURL(file)}});loadFriendsForInvite();document.querySelector('.modal-confirm').addEventListener('click',createGroup)}

async function loadFriendsForInvite(){const el=document.getElementById('createGroupInviteList');if(!el)return;if(!state.friends||state.friends.length===0){el.innerHTML='<div style="color:var(--text3);font-size:12px;padding:4px">暂无好友</div>';return}el.innerHTML=state.friends.map(f=>'<label class="chk" style="display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer"><input type="checkbox" value="'+escHtml(f.userId)+'"><span class="cbx-box"></span><div class="friend-avatar" style="width:24px;height:24px">'+avatarHTML(f,24)+'</div><span style="font-size:13px">'+escHtml(f.displayName||f.username)+'</span></label>').join('')}

async function createGroup(){const name=document.getElementById('createGroupName').value.trim();if(!name){showToast('请输入组名','error');return}const code=document.getElementById('createGroupCode').value.trim();const upload=document.querySelector('input[name="createGroupUpload"]:checked').value;const avatarEl=document.getElementById('createGroupAvatarPreview');const avatarImg=avatarEl?avatarEl.querySelector('img'):null;const avatar=avatarImg?avatarImg.src:'';const inviteIds=Array.from(document.querySelectorAll('#createGroupInviteList input[type="checkbox"]:checked')).map(c=>c.value);const r=await fetch('/api/groups/actions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,groupCode:code||undefined,avatar,defaultUpload:upload,inviteIds})});const d=await r.json();if(d.code!==0){showToast(d.message||'创建失败','error');return}showToast('组已创建','success');closeAllModals();loadMyGroups();loadGroups()}

function showJoinGroupModal(){showModal('<div class="modal-title">加入组</div><div class="modal-body"><div class="form-group"><label>搜索组号</label><div style="display:flex;gap:8px"><input class="input" id="joinGroupCode" placeholder="输入6位组号" maxlength="6"><button class="btn btn-accent" id="joinGroupSearchBtn" style="white-space:nowrap">搜索</button></div></div><div id="joinGroupResult" style="margin-top:12px"></div></div><div class="modal-actions"><button class="btn btn-ghost modal-cancel">关闭</button></div>');document.querySelector('.modal-cancel').addEventListener('click',e=>e.target.closest('.modal-overlay').remove());document.getElementById('joinGroupSearchBtn').addEventListener('click',searchGroupToJoin);document.getElementById('joinGroupCode').addEventListener('keydown',e=>{if(e.key==='Enter')searchGroupToJoin()})}

async function searchGroupToJoin(){const code=document.getElementById('joinGroupCode').value.trim();if(!code){showToast('请输入组号','error');return}const el=document.getElementById('joinGroupResult');el.innerHTML='<div class="loading"><div class="spinner"></div></div>';const r=await fetch('/api/groups/actions?action=search&code='+encodeURIComponent(code));const d=await r.json();if(d.code!==0||!d.data){el.innerHTML='<div style="padding:12px;text-align:center;color:var(--text3);font-size:13px">'+escHtml(d.message||'未找到该组')+'</div>';return}const g=d.data;el.innerHTML='<div class="friend-request-item" style="border:1px solid var(--border);border-radius:8px;padding:12px"><div class="friend-avatar" style="width:48px;height:48px">'+(g.avatar?'<img src="'+escHtml(g.avatar)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:24px;height:24px;color:var(--text3)"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>')+'</div><div style="flex:1"><div style="font-size:14px;font-weight:600">'+escHtml(g.name)+'</div><div style="font-size:12px;color:var(--text3)">'+g.memberCount+' 人</div></div>'+(g.joined?'<span class="badge" style="background:var(--surface);color:var(--text2)">已加入</span>':'<button class="btn btn-accent" onclick="joinGroup(\''+escHtml(g.id)+'\')">加入</button>')+'</div>'}

async function joinGroup(groupId){const r=await fetch('/api/groups/actions?action=join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({groupId})});const d=await r.json();showToast(d.code===0?'已加入组':(d.message||'加入失败'),d.code===0?'success':'error');if(d.code===0){closeAllModals();loadMyGroups();loadGroups()}}

async function showGroupDetail(groupId){state.currentView='groupDetail';const toolbar=document.getElementById('toolbar');const batchBar=document.getElementById('batchBar');const fileArea=document.getElementById('fileArea');if(toolbar)toolbar.style.display='none';if(batchBar)batchBar.style.display='none';if(fileArea)fileArea.style.display='none';let fp=document.querySelector('.friends-page');if(!fp){fp=document.createElement('div');fp.className='friends-page';document.querySelector('.content').appendChild(fp)}fp.innerHTML='<div class="loading"><div class="spinner"></div></div>';const r=await fetch('/api/groups/'+groupId);const d=await r.json();if(d.code!==0||!d.data){fp.innerHTML='<div style="padding:20px;text-align:center;color:var(--text3)">'+escHtml(d.message||'加载失败')+'</div>';return}const g=d.data;state.currentGroup=g;const isOwner=g.myRole==='owner';const isAdmin=g.myRole==='admin'||isOwner;fp.innerHTML='<div class="friends-header"><div style="display:flex;align-items:center;gap:12px"><button class="btn btn-ghost" onclick="showFriendsPage()" style="padding:4px 8px;font-size:12px">← 返回</button><h2 style="margin:0">'+escHtml(g.name)+'</h2><span class="badge" style="background:var(--surface);color:var(--text2)">'+escHtml(g.groupCode)+'</span></div></div><div style="padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:900px"><div><div style="font-size:14px;font-weight:600;margin-bottom:12px">组信息</div><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div id="groupDetailAvatar" style="width:64px;height:64px;border-radius:50%;background:var(--surface);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden">'+(g.avatar?'<img src="'+escHtml(g.avatar)+'" style="width:100%;height:100%;object-fit:cover">':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:28px;height:28px;color:var(--text3)"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>')+(isAdmin?'<input type="file" id="groupAvatarInput" accept="image/*" style="display:none">':'')+'</div><div><div style="font-size:13px;color:var(--text3)">组头像'+(isAdmin?' (点击更换)':'')+'</div><div style="font-size:12px;color:var(--text3)">组号: '+escHtml(g.groupCode)+'</div></div></div>'+(isAdmin?'<div class="form-group"><label>组名</label><div style="display:flex;gap:8px"><input class="input" id="groupNameInput" value="'+escHtml(g.name)+'"><button class="btn btn-accent" onclick="updateGroupName(\''+escHtml(g.id)+'\')" style="white-space:nowrap">保存</button></div></div><div class="form-group"><label>组号（6位纯数字）</label><div style="display:flex;gap:8px"><input class="input" id="groupCodeInput" value="'+escHtml(g.groupCode)+'" maxlength="6"><button class="btn btn-accent" onclick="updateGroupCode(\''+escHtml(g.id)+'\')" style="white-space:nowrap">保存</button></div></div><div class="form-group"><label>默认上传权限</label><div style="display:flex;gap:12px"><label class="chk"><input type="radio" name="groupDefaultUpload" value="on" '+(g.defaultUpload==='on'?'checked':'')+'><span></span>所有人可上传</label><label class="chk"><input type="radio" name="groupDefaultUpload" value="off" '+(g.defaultUpload==='off'?'checked':'')+'><span></span>仅管理员可上传</label></div><button class="btn btn-accent" onclick="updateGroupDefaultUpload(\''+escHtml(g.id)+'\')" style="margin-top:8px;padding:4px 12px;font-size:12px">保存上传设置</button></div>':'')+'<div class="form-group"><label>我的备注</label><div style="display:flex;gap:8px"><input class="input" id="groupMyNote" value="'+escHtml(g.myNote||'')+'" placeholder="给自己备注"><button class="btn btn-ghost" onclick="saveGroupMyNote(\''+escHtml(g.id)+'\')" style="white-space:nowrap">保存</button></div></div><div class="form-group"><label>共享个人文件给组内</label><label class="chk"><input type="checkbox" id="sharePersonalToggle" '+(g.mySharePersonal?'checked':'')+'><span class="cbx-box"></span>开启后组内成员可以看到我的个人文件</label><button class="btn btn-ghost" onclick="toggleSharePersonal(\''+escHtml(g.id)+'\')" style="margin-top:6px;padding:4px 12px;font-size:12px">保存</button></div>'+(g.myRole!=='owner'?'<div style="margin-top:16px"><button class="btn btn-ghost" style="color:var(--danger);border:1px solid var(--danger)" onclick="leaveGroup(\''+escHtml(g.id)+'\')">退出组</button></div>':'')+'</div><div><div style="font-size:14px;font-weight:600;margin-bottom:12px">成员 ('+g.members.length+')</div><div id="groupMembersList">'+renderGroupMembers(g)+'</div></div></div><div style="padding:0 16px 16px"><div style="font-size:14px;font-weight:600;margin-bottom:8px">组内聊天</div><div id="groupChatPanel" style="border:1px solid var(--border);border-radius:8px;overflow:hidden;height:300px;display:flex;flex-direction:column"><div id="groupChatMessages" style="flex:1;overflow-y:auto;padding:8px"></div><div style="display:flex;gap:8px;padding:8px;border-top:1px solid var(--border)"><button class="chat-share-btn" title="分享网盘文件" onclick="showGroupShareFileModal(\''+escHtml(g.id)+'\')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></button><input class="input" id="groupChatInput" placeholder="输入消息..." style="flex:1" onkeydown="if(event.key===\'Enter\')sendGroupChatMsg(\''+escHtml(g.id)+'\')"><button class="btn btn-accent" onclick="sendGroupChatMsg(\''+escHtml(g.id)+'\')">发送</button></div></div></div>';if(isAdmin){document.getElementById('groupAvatarInput').addEventListener('change',e=>{const file=e.target.files[0];if(file){const reader=new FileReader();reader.onload=ev=>{document.getElementById('groupDetailAvatar').innerHTML='<img src="'+ev.target.result+'" style="width:100%;height:100%;object-fit:cover">';updateGroupAvatar(groupId,ev.target.result)};reader.readAsDataURL(file)}});document.getElementById('groupDetailAvatar').addEventListener('click',()=>{if(isAdmin)document.getElementById('groupAvatarInput').click()})}loadGroupChatMessages(groupId);updateGroupOnlineStatus(groupId,'online')}

function renderGroupMembers(g){return g.members.map(m=>{const roleLabel=m.role==='owner'?'群主':m.role==='admin'?'管理员':'';const online=m.onlineStatus==='online'?'??':'?';return'<div class="friend-request-item" style="padding:8px;border-bottom:1px solid var(--border)"><div class="friend-avatar" style="width:36px;height:36px">'+avatarHTML(m,36)+'</div><div style="flex:1"><div style="font-size:13px;display:flex;align-items:center;gap:6px">'+escHtml(m.displayName||m.username)+' <span style="font-size:10px">'+online+'</span>'+(roleLabel?'<span class="badge" style="background:var(--surface);color:var(--text2);font-size:10px;padding:1px 6px">'+roleLabel+'</span>':'')+'</div>'+(m.note?'<div style="font-size:11px;color:var(--text3)">备注: '+escHtml(m.note)+'</div>':'')+'</div>'+(g.myRole==='owner'&&m.role!=='owner'?'<div style="display:flex;gap:4px"><select class="input" style="width:auto;padding:2px 6px;font-size:11px" onchange="setMemberRole(\''+escHtml(g.id)+'\',\''+escHtml(m.id)+'\',this.value)"><option value="member"'+(m.role==='member'?' selected':'')+'>成员</option><option value="admin"'+(m.role==='admin'?' selected':'')+'>管理员</option></select><button class="btn btn-ghost" style="padding:2px 6px;font-size:11px;color:var(--danger)" onclick="removeMember(\''+escHtml(g.id)+'\',\''+escHtml(m.id)+'\')">移除</button></div>':'')+'</div>'}).join('')}

async function updateGroupName(groupId){const name=document.getElementById('groupNameInput').value.trim();if(!name){showToast('请输入组名','error');return}const r=await fetch('/api/groups/'+groupId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});const d=await r.json();showToast(d.code===0?'已更新':(d.message||'失败'),d.code===0?'success':'error');if(d.code===0){loadMyGroups();loadGroups()}}

async function updateGroupCode(groupId){const code=document.getElementById('groupCodeInput').value.trim();if(!/^\d{6}$/.test(code)){showToast('组号必须为6位纯数字','error');return}const r=await fetch('/api/groups/'+groupId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({groupCode:code})});const d=await r.json();showToast(d.code===0?'已更新':(d.message||'失败'),d.code===0?'success':'error')}

async function updateGroupDefaultUpload(groupId){const upload=document.querySelector('input[name="groupDefaultUpload"]:checked').value;const r=await fetch('/api/groups/'+groupId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({defaultUpload:upload})});const d=await r.json();showToast(d.code===0?'已更新':(d.message||'失败'),d.code===0?'success':'error')}

async function updateGroupAvatar(groupId,avatarUrl){const r=await fetch('/api/groups/'+groupId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({avatar:avatarUrl})});const d=await r.json();if(d.code===0){loadMyGroups();loadGroups()}}

async function saveGroupMyNote(groupId){const note=document.getElementById('groupMyNote').value.trim();const r=await fetch('/api/groups/'+groupId+'/my-note',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({note})});const d=await r.json();showToast(d.code===0?'已保存':(d.message||'失败'),d.code===0?'success':'error')}

async function toggleSharePersonal(groupId){const share=document.getElementById('sharePersonalToggle').checked;const r=await fetch('/api/groups/'+groupId+'/share-personal',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({share})});const d=await r.json();showToast(d.code===0?(share?'已开启共享':'已关闭共享'):(d.message||'失败'),d.code===0?'success':'error')}

async function leaveGroup(groupId){if(!confirm('确定要退出该组吗？'))return;const r=await fetch('/api/groups/'+groupId+'/leave',{method:'DELETE'});const d=await r.json();showToast(d.code===0?'已退出':(d.message||'失败'),d.code===0?'success':'error');if(d.code===0){showFriendsPage();loadMyGroups();loadGroups()}}

async function setMemberRole(groupId,uid,role){const r=await fetch('/api/groups/'+groupId+'/members/'+uid+'/role',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({role})});const d=await r.json();showToast(d.code===0?'已设置':(d.message||'失败'),d.code===0?'success':'error');if(d.code===0)showGroupDetail(groupId)}

async function removeMember(groupId,uid){if(!confirm('确定移除该成员吗？'))return;const r=await fetch('/api/groups/'+groupId+'/members/'+uid,{method:'DELETE'});const d=await r.json();showToast(d.code===0?'已移除':(d.message||'失败'),d.code===0?'success':'error');if(d.code===0)showGroupDetail(groupId)}

async function loadGroupChatMessages(groupId){const r=await fetch('/api/groups/'+groupId+'/chat');const d=await r.json();if(d.code!==0)return;const el=document.getElementById('groupChatMessages');if(!el)return;const msgs=(d.data&&d.data.messages)||[];if(msgs.length===0){el.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text3);font-size:13px">暂无消息</div>';return}el.innerHTML=msgs.map(m=>{const isSelf=m.senderId===currentUserProfile.id;const cls=isSelf?'self':'other';const time=m.createdAt?new Date(m.createdAt.replace(' ','T')+'Z').toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';let content='';if(m.messageType==='file'){content='<div class="chat-msg-file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span class="chat-msg-file-name">'+escHtml(m.message||'文件')+'</span></div>'}else{content='<div class="chat-msg-bubble">'+escHtml(m.message)+'</div>'}return'<div class="chat-msg '+cls+'">'+(isSelf?'':('<div style="font-size:11px;color:var(--text3);margin-bottom:2px">'+escHtml(m.displayName||m.username)+'</div>'))+content+'<div class="chat-msg-time">'+time+'</div></div>'}).join('');el.scrollTop=el.scrollHeight}

async function sendGroupChatMsg(groupId){const inp=document.getElementById('groupChatInput');if(!inp)return;const content=inp.value.trim();if(!content)return;inp.value='';await fetch('/api/groups/'+groupId+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:content,messageType:'text'})});loadGroupChatMessages(groupId)}

// 头像上传：裁剪结果先存到网盘，再把真实 URL 写进用户资料
async function uploadAvatarBlob(blob){
  let ch=uploadChannelKey(), chName=uploadChannelName();
  if(ch==='auto'){const p=autoPickChannel(blob.size);ch=p?(p.key||p.channel):ch;chName=p?(p.channelInstance||p.name||''):''}
  const fd=new FormData();fd.append('file',blob,'avatar.png');

/* ===== 头像裁剪器（预览与输出严格一致）=====
   坐标约定：ox / oy / scale 全部工作在「视图 CSS 像素」空间里，1 单位 = 1 显示像素。
   · 预览：画布按 devicePixelRatio 放大，再用 setTransform 把坐标空间还原成 CSS 像素 →
     画布上的 1 单位永远等于屏幕上的 1px，不受元素尺寸 / 缩放影响。
   · 输出：把同一套变换按 OUT/V 整体等比放大，再用内切圆裁剪。
   两者只差一个等比系数，所以「预览里看到的圆形区域」与「实际上传的图片」必然一致。 */
/* ===== 头像裁剪器 =====
   设计：整张图片按原始比例**完整展示**（不裁掉任何边缘），用户在图片上拖动圆形裁剪框取景。
   · 唯一事实来源是「图像坐标」：crop = { x, y, d }，单位都是原图像素。
   · 舞台（stage）的宽高比 == 图片宽高比 → 框外的灰色区域就是图片本身的形状，不是被强行拉成 1:1。
   · 输出时直接把 crop（图像坐标下的正方形包围盒）画进 512×512 再做内切圆裁剪 ——
     所见即所得，而且是从原图取区域，清晰度不受显示缩放影响。 */
async function avatarCropperCore(file,onConfirm){
  const OUT=512;
  const overlay=document.createElement('div');
  overlay.className='avatar-cropper-overlay';
  overlay.innerHTML='<div class="avatar-cropper"><div class="avatar-cropper-title">裁剪头像</div>'
    +'<div class="cropper-stage" id="cropStage"><img id="cropImg" alt=""><div class="cropper-frame" id="cropFrame"></div></div>'
    +'<div class="avatar-cropper-hint">拖动圆形框选择范围 · 拖滑块调整框大小</div>'
    +'<div class="avatar-cropper-slider"><input type="range" id="cropperZoom" min="0" max="1" step="0.001" value="1"></div>'
    +'<div class="avatar-cropper-actions"><button class="btn btn-ghost" id="cropperCancel">取消</button><button class="btn btn-accent" id="cropperConfirm">确认</button></div></div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});

  const box=overlay.querySelector('.avatar-cropper');
  const stage=document.getElementById('cropStage');
  const frame=document.getElementById('cropFrame');
  const el=document.getElementById('cropImg');
  const zoom=document.getElementById('cropperZoom');

  let imgW=0,imgH=0,scale=1,minD=0,maxD=0;
  const crop={x:0,y:0,d:0};

  const clampD=()=>{crop.d=Math.max(minD,Math.min(maxD,crop.d))};
  const clampXY=()=>{
    crop.x=Math.max(0,Math.min(imgW-crop.d,crop.x));
    crop.y=Math.max(0,Math.min(imgH-crop.d,crop.y))};
  const draw=()=>{
    if(!crop.d)return;
    frame.style.left=(crop.x*scale)+'px';
    frame.style.top=(crop.y*scale)+'px';
    frame.style.width=(crop.d*scale)+'px';
    frame.style.height=(crop.d*scale)+'px'};

  const layout=()=>{
    if(!imgW)return;
    const cs=window.getComputedStyle(box);
    const availW=Math.max(160,(box.clientWidth||380)-parseFloat(cs.paddingLeft||0)-parseFloat(cs.paddingRight||0));
    const availH=Math.max(160,Math.min(380,Math.round(window.innerHeight*0.52)));
    // 不取整：舞台宽高比必须与图片严格一致，否则图片会被压扁一点、
    // 而且 scale 在 x/y 两个方向不一致，裁剪坐标就会有偏差
    let sw=availW, sh=availW*imgH/imgW;
    if(sh>availH){sh=availH;sw=availH*imgW/imgH}
    stage.style.width=sw+'px';
    stage.style.height=sh+'px';
    scale=sw/imgW;                       // 舞台 px / 图像 px
    maxD=Math.min(imgW,imgH);            // 能完整塞进图里的最大圆
    minD=Math.max(16,maxD*0.16);
    if(crop.d>0){clampD();clampXY();draw()}
  };

  el.onload=()=>{
    imgW=el.naturalWidth;imgH=el.naturalHeight;
    crop.d=0;crop.x=0;crop.y=0;
    layout();                            // 先算出 maxD / scale
    crop.d=maxD;crop.x=(imgW-crop.d)/2;crop.y=(imgH-crop.d)/2;   // 默认取最大圆并居中
    clampD();clampXY();draw();
    zoom.value='1';
  };
  el.onerror=()=>showToast('图片读取失败，换一张试试','error');
  el.src=URL.createObjectURL(file);

  /* ---- 拖动圆形框（只在框内按下才生效，框外点击留给「点背景关闭」）---- */
  let dragging=false,lx=0,ly=0;
  const startDrag=(x,y)=>{dragging=true;lx=x;ly=y;frame.classList.add('dragging')};
  const moveDrag=(x,y)=>{
    if(!dragging)return;
    crop.x+=(x-lx)/scale;crop.y+=(y-ly)/scale;
    lx=x;ly=y;clampXY();draw()};
  const endDrag=()=>{dragging=false;frame.classList.remove('dragging')};

  overlay.addEventListener('mousedown',e=>{
    if(!e.target.closest('#cropFrame'))return;
    e.preventDefault();startDrag(e.clientX,e.clientY)});
  overlay.addEventListener('mousemove',e=>moveDrag(e.clientX,e.clientY));
  overlay.addEventListener('mouseup',endDrag);
  overlay.addEventListener('mouseleave',endDrag);
  overlay.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||!e.target.closest('#cropFrame'))return;
    e.preventDefault();startDrag(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
  overlay.addEventListener('touchmove',e=>{
    if(e.touches.length!==1)return;
    e.preventDefault();moveDrag(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
  overlay.addEventListener('touchend',endDrag);

  /* ---- 滑块改圆形框大小（以框心为锚点）---- */
  zoom.addEventListener('input',()=>{
    if(!imgW)return;
    const t=parseFloat(zoom.value)||0;
    const nd=minD+(maxD-minD)*t;
    const cx=crop.x+crop.d/2,cy=crop.y+crop.d/2;
    crop.d=nd;crop.x=cx-nd/2;crop.y=cy-nd/2;
    clampD();clampXY();draw()});

  const relayout=()=>layout();
  window.addEventListener('resize',relayout);
  const cleanup=()=>window.removeEventListener('resize',relayout);

  document.getElementById('cropperCancel').addEventListener('click',()=>{cleanup();overlay.remove()});
  document.getElementById('cropperConfirm').addEventListener('click',()=>{
    if(!imgW||!crop.d)return;
    const btn=document.getElementById('cropperConfirm');
    btn.disabled=true;btn.textContent='上传中...';
    const out=document.createElement('canvas');out.width=OUT;out.height=OUT;
    const octx=out.getContext('2d');
    octx.beginPath();octx.arc(OUT/2,OUT/2,OUT/2,0,Math.PI*2);octx.clip();
    // crop 就是图像坐标下的正方形包围盒，直接取这一块 → 与框内所见完全一致
    const sd=Math.max(1,Math.round(crop.d));
    octx.drawImage(el,Math.round(crop.x),Math.round(crop.y),sd,sd,0,0,OUT,OUT);
    out.toBlob(async blob=>{
      if(!blob){showToast('生成图片失败','error');btn.disabled=false;btn.textContent='确认';return}
      try{await onConfirm(blob);cleanup();overlay.remove()}
      catch(err){showToast('头像上传失败：'+((err&&err.message)||''),'error');btn.disabled=false;btn.textContent='确认'}
    },'image/png')});
}

// 网盘页：裁好直接上传并把 URL 写进用户资料
function openAvatarCropper(file){
  avatarCropperCore(file,async blob=>{
    const url=await uploadAvatarBlob(blob);
    await saveAvatar(url);
    showToast('头像已更新','success');
    closeAllModals();
  })
}

// 顶栏三段条当前展示的范围：选了具体渠道就看该渠道，自动通道看合计
function currentScope(){const q=state.quota||{};const auto={label:'全部通道',used:q.used||0,selfUsed:q.selfUsed||0,othersUsed:q.othersUsed||0,total:q.total||0,available:q.available,unlimited:!!q.unlimited};if(state.uploadChannel==='auto'||!(state.channels||[]).length)return auto;const ch=(state.channels||[]).find(c=>c.key===state.uploadChannel);if(!ch)return auto;return{label:ch.displayName,used:ch.usedBytes||0,selfUsed:(ch.quota&&ch.quota.selfUsed)||0,othersUsed:(ch.quota&&ch.quota.othersUsed)||0,total:(ch.quota&&ch.quota.total)||0,available:ch.quota?ch.quota.available:null,unlimited:!!ch.unlimited}}

function updateStorageBar(){const oE=document.getElementById('storageOthers');const sE=document.getElementById('storageSelf');const t=document.getElementById('storageText');if(!oE||!sE||!t)return;const s=currentScope();const denom=s.unlimited?Math.max(1,s.used):(s.total||0);if(denom<=0){oE.style.width='0%';sE.style.width='0%';t.textContent='0 B';return}const othersPct=Math.min(100,(s.othersUsed/denom)*100);const selfPct=Math.min(100,(s.selfUsed/denom)*100);oE.style.width=othersPct+'%';sE.style.width=selfPct+'%';t.textContent=formatSize(s.used)+(s.unlimited?' / 不限额':' / '+formatSize(s.total));t.title='当前统计范围：'+s.label;const lg=document.getElementById('storageLegend');if(lg){lg.innerHTML='<span><i style="background:#6B7280"></i>其他用户 '+formatSize(s.othersUsed)+'</span><span><i style="background:var(--accent)"></i>我自己 '+formatSize(s.selfUsed)+'</span><span><i style="background:var(--surface);border:1px solid var(--border)"></i>'+(s.unlimited?'不限额':'可用 '+formatSize(s.available||0))+'</span><span style="opacity:.65">统计范围：'+escHtml(s.label)+'</span>'}}

function renderChannels(arr){const c=document.getElementById('channelsContainer');if(!c)return;c.innerHTML=arr.map(ch=>{const used=ch.usedBytes||0;const total=(ch.quota&&ch.quota.total)||0;const unlimited=!!ch.unlimited||total===0;const pct=unlimited?0:(total>0?Math.min(100,(used/total)*100):0);const color=pct>90?'var(--red)':pct>70?'var(--orange)':'var(--green)';const cap=unlimited?'无限容量':formatSize(total);const fill=unlimited?'background:repeating-linear-gradient(90deg,rgba(138,130,184,.5) 0 3px,transparent 3px 7px)':'background:'+color;return'<div class="sidebar-channel"><span class="ch-ico">'+channelIconHTML(ch.key||ch.channel,14)+'</span><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px"><span style="font-size:12px;font-weight:500;color:var(--text)">'+escHtml(ch.displayName||ch.name)+'</span><span style="font-size:10px;color:var(--text3);margin-left:auto;white-space:nowrap">'+cap+'</span></div><div style="display:flex;align-items:center;gap:6px;margin-top:3px"><div class="channel-bar"><div class="channel-fill" style="width:'+(unlimited?100:pct)+'%;'+fill+'"></div></div><span style="font-size:10px;color:var(--text3);white-space:nowrap">'+formatSize(used)+'</span></div></div></div>'}).join('');
  // 通道下拉（顶栏 + 侧栏）跟随实际启用的通道；选项变化由 MutationObserver 自动同步到自定义下拉
  if(!arr.length)return;
  const fullOpts='<option value="auto">自动通道（全部）</option>'+arr.map(ch=>'<option value="'+String(ch.key||'').replace(/[^\w-]/g,'')+'">'+escHtml(ch.displayName||ch.name||ch.key)+'</option>').join('');
  const shortOpts='<option value="auto">自动（按剩余空间）</option>'+arr.map(ch=>'<option value="'+String(ch.key||'').replace(/[^\w-]/g,'')+'">'+escHtml(ch.displayName||ch.name||ch.key)+'</option>').join('');
  if(state.uploadChannel!=='auto'&&!arr.some(ch=>ch.key===state.uploadChannel))state.uploadChannel='auto';
  const a=document.getElementById('uploadChannelSelect');
  const b=document.getElementById('uploadChannelSide');
  if(a)a.innerHTML=fullOpts;
  if(b)b.innerHTML=shortOpts;
  if(a)a.value=state.uploadChannel;
  if(b)b.value=state.uploadChannel;
  updateStorageBar();
}

function openGroupSharedFolder(groupId,groupName){state.nav='group';state.currentDir='';state.currentGroupId=groupId;state.currentGroupName=groupName;state.start=0;state.search='';const si=document.getElementById('searchInput');if(si)si.value='';showFilesView();loadFiles()}

function setupScroll(){const a=document.getElementById('fileArea');if(a)a.addEventListener('scroll',()=>{if(state.loading||!state.hasMore)return;if(a.scrollTop+a.clientHeight>=a.scrollHeight-100){loadFiles(false)}})}

async function loadFiles(reset=true){if(state.loading&&!reset)return;state.loading=true;if(reset){state.start=0;state.files=[];state.hasMore=true;state.selected.clear();updateBatchBar()}const sv=document.getElementById('sortSelect').value;const[sort,order]=sv.split('-');const navFilter=state.nav==='images'?'image':state.nav==='videos'?'video':state.nav==='docs'?'doc':'';
  const dir=(state.nav==='all'||state.nav==='group')?state.currentDir:'';
  const p=new URLSearchParams({start:state.start,count:state.count,dir,search:state.search,sort,order});
  if(navFilter)p.set('type',navFilter);
  if(navFilter||state.nav==='recent')p.set('recursive','true');
  if(state.nav==='group'&&state.currentGroupId)p.set('groupId',state.currentGroupId);
  showLoading(true);

  else{showToast(d.message||'加载文件失败','error')}

1 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>':'')+'<button class="file-action del" data-action="delete" data-fid="'+escHtml(fid)+'" title="删除"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div>'}

function renderList(area){let html='<table class="file-table"><thead><tr><th class="cb-cell"><label class="cbx" title="全选"><input type="checkbox" id="selectAllCb"><span class="cbx-box"></span></label></th><th>文件名</th><th>大小</th><th class="col-date">上传时间</th><th class="col-owner">所有者</th><th class="col-channel">通道</th><th style="width:170px">操作</th></tr></thead><tbody>'+folderRowsHTML();
